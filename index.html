  #login form { width: 100%; max-width: 360px; background: #ffffff; color: #1f2937; border-radius: 14px; padding: 24px 24px 18px;
    box-shadow: 0 12px 40px rgba(36,104,176,.18), 0 2px 8px rgba(0,0,0,.08); border-top: 4px solid #BD171E; }
  #login h2 { text-align: center; font-size: 18px; color: #2468B0; margin: 0 0 16px; }
  #login label { color: #6b7280; }
  #login input { background: #f4f5f7; color: #1f2937; border-color: #e5e7eb; }
  #login .btn { margin-top: 6px; background: #2468B0; color: #fff; }
  #loginErr { color: #BD171E; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  #report { flex: 1; height: 100%; overflow: auto; padding: 20px 24px; background: var(--bg); }
  #report h2 { margin: 0 0 12px; font-size: 20px; color: var(--accent); }
  .rep-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 16px; }
  .rep-ctrl label { margin: 0; }
  .rep-ctrl .btn, .rep-ctrl .btn2 { width: auto; padding: 9px 14px; }
  .btn2 { padding: 9px 14px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); font-size: 14px; cursor: pointer; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpis .stat b { font-size: 24px; }
  .rep-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .rep-tabs button { padding: 7px 14px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); border-radius: 8px; cursor: pointer; }
  .rep-tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  .tbl td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--bg2); }
  .mini { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--bg2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .mini i { display: block; height: 100%; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff; }
  .days span { display: inline-block; width: 18px; text-align: center; border-radius: 4px; font-size: 11px; margin-right: 2px; background: var(--bg2); color: var(--muted); }
  .days span.on { background: var(--accent); color: var(--accent-text); }
  .chk { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .chk input { width: auto; margin: 0; }
  .arrow svg { width: 16px; height: 16px; }
  .brand { background: #ffffff; padding: 14px 16px 10px; text-align: center; border-bottom: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--red) 50%, #2468B0 50%) 1; }
  .brand img { max-width: 230px; width: 100%; height: auto; display: block; margin: 0 auto; }
  header { padding: 12px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 16px; margin: 0; color: var(--accent); font-weight: 700; letter-spacing: .2px; }
  @media (prefers-color-scheme: dark) { h1 { color: #ffffff; } }
  .live { font-size: 12px; color: var(--muted); }
  .live.on { color: var(--move); }
  .tabs { display: flex; gap: 4px; padding: 0 16px 12px; }
  .tabs button { flex: 1; padding: 8px 4px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  section { padding: 0 16px 16px; overflow-y: auto; flex: 1; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--text); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  label input, label select { margin-top: 4px; }
  .btn { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font-size: 14px; cursor: pointer; }
  .summary { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .summary span { display: inline-flex; align-items: center; gap: 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.veh { padding: 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  li.veh:hover { background: var(--bg2); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .name { font-weight: 600; font-size: 14px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .stat { background: var(--bg2); border-radius: 8px; padding: 10px; }
  .stat b { display: block; font-size: 18px; }
  .stat small { color: var(--muted); font-size: 12px; }
  .msg { font-size: 13px; color: var(--muted); margin: 12px 0; }
  .err { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 13px; margin: 0 16px 12px; }
  #hInfo { font-size: 13px; margin-top: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gauge { text-align: center; margin: 16px 0 8px; }
  .gauge b { font-size: 44px; line-height: 1; }
  .bar { height: 10px; border-radius: 5px; background: var(--bg2); overflow: hidden; margin: 10px 0 14px; }
  .bar div { height: 100%; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  input[type=range] { accent-color: var(--accent); padding: 0; margin-top: 8px; }
  .vicon img { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; border: 3px solid;
    box-sizing: border-box; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .vdir { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
  .vdir i { position: absolute; left: 50%; top: -10px; margin-left: -7px; width: 0; height: 0;
    border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 10px solid; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.5; }
  @media (max-width: 700px) {
    .brand img { max-width: 150px; }
    body { flex-direction: column; }
    #side { width: 100%; height: 45%; border-right: 0; border-bottom: 1px solid var(--border); }
    #map { height: 55%; }
  }
</style>
</head>

function cleanTrack(rows) {

function icon(p) {
  const s = status(p);
  const arrow = s === 'move'
    ? `<div class="vdir" style="transform:rotate(${p.angle || 0}deg)"><i style="border-bottom-color:${HEX[s]}"></i></div>` : '';
  return L.divIcon({
    className: 'vicon', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20],
    html: `${arrow}<img src="${VEH_IMG}" alt="" style="border-color:${HEX[s]}">`,
  });
}
// Batterie interne du boîtier : IO 113 (niveau en %) si disponible,
// sinon estimation à partir de IO 67 (tension batterie en mV, Li-ion 3,5 V → 0 %, 4,1 V → 100 %)
function battery(p) {
  const io = p.io || {};
  if (io['113'] !== undefined) return { pct: Math.min(100, Math.max(0, +io['113'])), est: false };
  if (io['67'] !== undefined && +io['67'] > 0) {
    const v = +io['67'] / 1000;
    return { pct: Math.round(Math.min(100, Math.max(0, (v - 3.5) / 0.6 * 100))), est: true, v };
  }
  return null;
}
function batteryHtml(p) {
  const b = battery(p);
  if (!b) return '';
  const col = b.pct > 50 ? '#16a34a' : b.pct > 20 ? '#f59e0b' : '#BD171E';
  return `<span style="white-space:nowrap" title="${b.est ? 'Estimé depuis la tension ' + b.v.toFixed(2) + ' V' : 'Niveau batterie (IO 113)'}">
    🔋 <b style="color:${col}">${b.est ? '≈' : ''}${b.pct} %</b></span>`;
}
function popup(d) {
  const p = d.last;
  const bat = batteryHtml(p);
  return `<b>${label(d)}</b>${d.plate && d.name ? ` — ${d.plate}` : ''}<br>
    ${LABELS[status(p)]} · ${p.speed} km/h<br>
    Contact : ${p.ignition === null ? '—' : p.ignition ? 'ON' : 'OFF'}
    ${p.ext_voltage ? ` · Alim. ${p.ext_voltage.toFixed(1)} V` : ''}<br>
    ${bat ? `Batterie boîtier : ${bat}<br>` : ''}
    <small>${fmtTime(p.ts)} · ${p.satellites} satellites</small>`;
}

// ---------- Flotte en temps réel ----------
function upsertDevice(row) {
  const d = devices.get(row.imei) || { imei: row.imei };
  if (row.name !== undefined) d.name = row.name;
  if (row.plate !== undefined) d.plate = row.plate;
  devices.set(row.imei, d);
  return d;
}
function updatePos(p) {
  if (!p.lat && !p.lng) return; // pas de fix GPS
  const d = upsertDevice({ imei: p.imei, ...(p.name !== undefined ? { name: p.name, plate: p.plate } : {}) });
  if (d.last && new Date(p.ts) < new Date(d.last.ts)) return;
  d.last = p;
  if (!d.marker) d.marker = L.marker([p.lat, p.lng], { icon: icon(p) }).addTo(fleetLayer);
  d.marker.setLatLng([p.lat, p.lng]).setIcon(icon(p)).bindPopup(popup(d));
}
function renderList() {
  const q = $('search').value.toLowerCase();
  const list = [...devices.values()].sort((a, b) => label(a).localeCompare(label(b)));
  const counts = { move: 0, idle: 0, stop: 0, off: 0 };
  $('list').innerHTML = '';
  for (const d of list) {
    const s = status(d.last);
    counts[s]++;
    if (d.marker) d.marker.setIcon(icon(d.last)).setPopupContent(popup(d));
    if (q && !`${label(d)} ${d.plate || ''} ${d.imei}`.toLowerCase().includes(q)) continue;
    const li = document.createElement('li');
    li.className = 'veh';
    li.innerHTML = `<span class="dot" style="background:${COLORS[s]}"></span>
      <div><div class="name">${label(d)}</div>
      <div class="sub">${d.last ? `${LABELS[s]} · ${d.last.speed} km/h · ${ago(d.last.ts)}${battery(d.last) ? ' · ' + batteryHtml(d.last) : ''}` : 'Aucune position'}</div></div>`;
    li.onclick = () => { if (d.marker) { map.flyTo(d.marker.getLatLng(), 16); d.marker.openPopup(); } };
    $('list').appendChild(li);
  }
  $('summary').innerHTML = Object.keys(counts)
    .map((k) => `<span><span class="dot" style="background:${COLORS[k]};margin:0"></span>${LABELS[k]} : ${counts[k]}</span>`).join('');
}
function fillHistSelect() {
  const opts = [...devices.values()].map((d) => `<option value="${d.imei}">${label(d)}</option>`).join('');
  for (const id of ['hDev', 'cDev']) {
    const cur = $(id).value;
    $(id).innerHTML = opts;
    if (cur) $(id).value = cur;
  }
}

let sb;
async function loadFleet(first) {
  const [r1, r2] = await Promise.all([sb.from('devices').select('*'), sb.from('last_positions').select('*')]);
  if (r1.error || r2.error) return showErr('Erreur Supabase : ' + (r1.error || r2.error).message);
  r1.data.forEach(upsertDevice);
  r2.data.forEach(updatePos);
  renderList();
  fillHistSelect();
  if (first) {
    const pts = [...devices.values()].filter((d) => d.last).map((d) => [d.last.lat, d.last.lng]);
    if (pts.length === 1) map.setView(pts[0], 15);
    else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40] });
  }
}

// ---------- Historique ----------
let histPts = [], cursor = null;
async function loadHistory() {
  const imei = $('hDev').value, day = $('hDate').value;
  if (!imei || !day) return;
  $('hStats').innerHTML = '<p class="msg">Chargement…</p>';
  const from = new Date(`${day}T${$('hFrom').value || '00:00'}:00`);
  const to = new Date(`${day}T${$('hTo').value || '23:59'}:59`);
  if (to <= from) to.setDate(to.getDate() + 1); // plage qui passe minuit
  let rows = [];
  for (let page = 0; ; page++) {
    const { data, error } = await sb.from('positions')
      .select('ts,lat,lng,speed,ignition,angle')
      .eq('imei', imei).gte('ts', from.toISOString()).lt('ts', to.toISOString())
      .order('ts').range(page * 1000, page * 1000 + 999);
    if (error) return showErr('Erreur Supabase : ' + error.message);
    rows = rows.concat(data);
    if (data.length < 1000) break;
  }
  histPts = cleanTrack(rows);
  histLayer.clearLayers();
  cursor = null;
  $('hSlider').hidden = true;
  $('hInfo').textContent = '';
  if (!histPts.length) { $('hStats').innerHTML = '<p class="msg">Aucune donnée sur cette période.</p>'; return; }

  // Distance, vitesse max, temps de conduite
  let km = 0, vmax = 0, driveMin = 0;
  for (let i = 1; i < histPts.length; i++) {
    const a = histPts[i - 1], b = histPts[i];
    const dt = (new Date(b.ts) - new Date(a.ts)) / 60000;
    if (a.speed > 3 || b.speed > 3) km += dist(a, b);
    if (a.speed > 3) driveMin += Math.min(dt, 5);
  }
  histPts.forEach((p) => { vmax = Math.max(vmax, p.speed); });

  // Arrêts de 5 min ou plus
  const stops = [];
  for (let i = 0; i < histPts.length;) {
    if (histPts[i].speed <= 3) {
      let j = i;
      while (j + 1 < histPts.length && histPts[j + 1].speed <= 3) j++;
      const end = j + 1 < histPts.length ? histPts[j + 1].ts : histPts[j].ts;
      const dur = (new Date(end) - new Date(histPts[i].ts)) / 60000;
      if (dur >= 5) stops.push({ p: histPts[i], from: histPts[i].ts, to: end, dur });
      i = j + 1;
    } else i++;
  }

  const line = L.polyline(histPts.map((p) => [p.lat, p.lng]), { color: '#2468B0', weight: 4 }).addTo(histLayer);
  const first = histPts[0], last = histPts[histPts.length - 1];
  L.circleMarker([first.lat, first.lng], { radius: 8, color: '#fff', fillColor: '#16a34a', fillOpacity: 1, weight: 2 })
    .bindPopup(`Départ ${fmtHour(first.ts)}`).addTo(histLayer);
  L.circleMarker([last.lat, last.lng], { radius: 8, color: '#fff', fillColor: '#BD171E', fillOpacity: 1, weight: 2 })
    .bindPopup(`Arrivée ${fmtHour(last.ts)}`).addTo(histLayer);
  stops.forEach((s, k) => L.circleMarker([s.p.lat, s.p.lng], { radius: 7, color: '#fff', fillColor: '#2563eb', fillOpacity: 1, weight: 2 })
    .bindPopup(`Arrêt ${k + 1}<br>${fmtHour(s.from)} → ${fmtHour(s.to)}<br>${durTxt(s.dur)}`).addTo(histLayer));
  map.fitBounds(line.getBounds(), { padding: [40, 40] });

  $('hStats').innerHTML = `<div class="stats">
      <div class="stat"><b>${km.toFixed(1)} km</b><small>Distance</small></div>
      <div class="stat"><b>${durTxt(driveMin)}</b><small>Temps de conduite</small></div>
      <div class="stat"><b>${vmax} km/h</b><small>Vitesse max</small></div>
      <div class="stat"><b>${stops.length}</b><small>Arrêts ≥ 5 min</small></div>
    </div><p class="msg">${fmtHour(first.ts)} → ${fmtHour(last.ts)} · ${histPts.length} points</p>`;
  $('hSlider').max = histPts.length - 1;
  $('hSlider').value = 0;
  $('hSlider').hidden = false;
  moveCursor(0);
}
function moveCursor(i) {
  const p = histPts[i];
  if (!p) return;
  if (!cursor) cursor = L.marker([p.lat, p.lng], { icon: icon({ ...p, ts: new Date().toISOString(), speed: Math.max(p.speed, 4) }) }).addTo(histLayer);
  cursor.setLatLng([p.lat, p.lng]).setIcon(icon({ ...p, ts: new Date().toISOString(), speed: Math.max(p.speed, 4) }));
  $('hInfo').textContent = `${fmtTime(p.ts)} · ${p.speed} km/h · contact ${p.ignition ? 'ON' : 'OFF'}`;
}

// ---------- Circuits : taux de réalisation ----------
const circuits = new Map();
async function loadCircuits() {
  const { data, error } = await sb.from('circuits_list').select('*').order('code');
  if (error) return; // table pas encore créée
  data.forEach((c) => circuits.set(String(c.id), c));
  $('cCirc').innerHTML = data.map((c) => `<option value="${c.id}">${c.code || ''}${c.name ? ' — ' + c.name : ''} (${c.km} km)</option>`).join('');
}
function showCircuit() {
  const c = circuits.get($('cCirc').value);
  circLayer.clearLayers();
  $('cRes').innerHTML = '';
  if (!c) return;
  $('cSens').checked = !!c.sens_strict;
  const l = L.geoJSON(c.geojson, { style: { color: '#6b7280', weight: 6, opacity: 0.7, dashArray: '8 6' } }).addTo(circLayer);
  map.fitBounds(l.getBounds(), { padding: [40, 40] });
}
async function calcCircuit() {
  const c = circuits.get($('cCirc').value), imei = $('cDev').value, day = $('cDate').value;
  if (!c || !imei || !day) return;
  const from = new Date(`${day}T${$('cFrom').value || '00:00'}:00`);
  const to = new Date(`${day}T${$('cTo').value || '23:59'}:59`);
  if (to <= from) to.setDate(to.getDate() + 1); // shift de nuit
  $('cRes').innerHTML = '<p class="msg">Calcul en cours…</p>';
  const { data: r, error } = await sb.rpc('circuit_realisation', {
    p_circuit: +c.id, p_imei: imei, p_from: from.toISOString(), p_to: to.toISOString(), p_tol: +$('cTol').value || 20,
    p_sens: $('cSens').checked,
  });
  if (error) { $('cRes').innerHTML = ''; return showErr('Erreur calcul : ' + error.message); }
  circLayer.clearLayers();
  const seg = L.geoJSON(r.segments, {
    style: (f) => ({ color: f.properties.ok ? '#16a34a' : '#BD171E', weight: 7, opacity: 0.9, lineCap: 'butt' }),
  }).addTo(circLayer);
  map.fitBounds(seg.getBounds(), { padding: [40, 40] });

  // Flèches du sens du circuit (tous les ~100 m) quand le sens est vérifié
  if (r.sens) {
    r.segments.features.forEach((ft, i) => {
      if (i % 4 !== 2) return;
      const [[x1, y1], [x2, y2]] = ft.geometry.coordinates;
      L.marker([(y1 + y2) / 2, (x1 + x2) / 2], { interactive: false, icon: L.divIcon({
        className: 'arrow', iconSize: [16, 16], iconAnchor: [8, 8],
        html: `<svg viewBox="0 0 16 16" style="transform:rotate(${ft.properties.az}deg)"><path d="M8 1 L14 14 L8 10.5 L2 14 Z" fill="#111827" stroke="#fff" stroke-width="1.2"/></svg>` }) }).addTo(circLayer);
    });
  }

  // Tracé GPS réel du véhicule sur la période (coupé si plus de 3 min sans point)
  let rows = [];
  for (let page = 0; ; page++) {
    const { data, error: e2 } = await sb.from('positions')
      .select('ts,lat,lng,speed').eq('imei', imei)
      .gte('ts', from.toISOString()).lt('ts', to.toISOString())
      .order('ts').range(page * 1000, page * 1000 + 999);
    if (e2 || !data) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
  }
  const lines = [];
  let cur = [];
  cleanTrack(rows).forEach((p, i, arr) => {
    if (i && new Date(p.ts) - new Date(arr[i - 1].ts) > 3 * 60000) { if (cur.length > 1) lines.push(cur); cur = []; }
    cur.push([p.lat, p.lng]);
  });
  if (cur.length > 1) lines.push(cur);
  if (lines.length) {
    L.polyline(lines, { color: '#2468B0', weight: 3, opacity: 0.95, dashArray: '6 5' })
      .bindTooltip('Tracé GPS du véhicule', { sticky: true }).addTo(circLayer);
  }
  const t = Number(r.taux ?? 0);
  const col = t >= 90 ? '#16a34a' : t >= 70 ? '#f59e0b' : '#BD171E';
  const manque = (r.longueur_m - r.realise_m) / 1000;
  $('cRes').innerHTML = `
    <div class="gauge"><b style="color:${col}">${t} %</b><div class="msg" style="margin:4px 0 0">Taux de réalisation</div></div>
    <div class="bar"><div style="width:${t}%;background:${col}"></div></div>
    <div class="stats">
      <div class="stat"><b>${(r.realise_m / 1000).toFixed(2)} km</b><small>Réalisé</small></div>
      <div class="stat"><b>${manque.toFixed(2)} km</b><small>Non réalisé</small></div>
      <div class="stat"><b>${r.t_debut ? fmtHour(r.t_debut) : '—'}</b><small>Entrée sur circuit</small></div>
      <div class="stat"><b>${r.t_fin ? fmtHour(r.t_fin) : '—'}</b><small>Dernier passage</small></div>
    </div>
    <div class="legend"><span><i style="background:#16a34a"></i>Réalisé</span><span><i style="background:#BD171E"></i>Non réalisé</span><span><i style="background:#2468B0"></i>Tracé GPS</span></div>
    ${r.sens ? '<p class="msg">▲ Sens du circuit vérifié : un passage dans le mauvais sens ne compte pas.</p>' : ''}`;
}

// ---------- Rapports ----------
const isoDay = (d) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmtDay = (s) => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: '2-digit' });
const tauxCol = (t, seuil) => (t >= (seuil ?? 90) ? '#16a34a' : t >= 70 ? '#f59e0b' : '#BD171E');
let repRows = [], repLoaded = false;

async function loadReport() {
  repLoaded = true;
  const f = $('rFrom').value, t = $('rTo').value;
  $('rRes').innerHTML = '<p class="msg">Chargement…</p>';
  const { data, error } = await sb.from('realisations_list').select('*')
    .gte('jour', f).lte('jour', t).order('jour', { ascending: false }).order('circuit_code');
  if (error) { $('rRes').innerHTML = ''; return showErr('Erreur rapports : ' + error.message); }
  repRows = data;
  const lon = data.reduce((a, r) => a + Number(r.longueur_m || 0), 0);
  const rea = data.reduce((a, r) => a + Number(r.realise_m || 0), 0);
  const moy = lon ? (100 * rea / lon) : 0;
  const nc = data.filter((r) => !r.conforme).length;
  $('rKpis').innerHTML = `
    <div class="stat"><b style="color:${tauxCol(moy)}">${moy.toFixed(1)} %</b><small>Taux moyen (pondéré km)</small></div>
    <div class="stat"><b>${data.length}</b><small>Circuits planifiés</small></div>
    <div class="stat"><b style="color:${nc ? '#BD171E' : '#16a34a'}">${nc}</b><small>Non conformes (sous le seuil)</small></div>
    <div class="stat"><b>${((lon - rea) / 1000).toFixed(1)} km</b><small>Non réalisés</small></div>`;
  if (!data.length) {
    $('rRes').innerHTML = '<p class="msg">Aucun résultat sur cette période. Vérifie le planning, puis clique sur « Recalculer la période ».</p>';
    return;
  }
  $('rRes').innerHTML = `<table class="tbl"><thead><tr>
      <th>Date</th><th>Circuit</th><th>Véhicule</th><th>Shift</th><th>Passage</th><th>Km réalisés</th><th>Taux</th><th>Statut</th>
    </tr></thead><tbody>${data.map((r, i) => {
      const t = Number(r.taux || 0), col = tauxCol(t, r.seuil);
      return `<tr class="click" data-i="${i}">
        <td>${fmtDay(r.jour)}</td>
        <td><b>${r.circuit_code}</b>${r.circuit_name && r.circuit_name !== r.circuit_code ? '<br><small>' + r.circuit_name + '</small>' : ''}</td>
        <td>${r.vehicule || r.plate || r.imei}</td>
        <td>${r.shift || ''}<br><small>${(r.heure_debut || '').slice(0, 5)}–${(r.heure_fin || '').slice(0, 5)}</small></td>
        <td>${r.t_debut ? fmtHour(r.t_debut) + '–' + fmtHour(r.t_fin) : '<small>aucun passage</small>'}</td>
        <td>${(r.realise_m / 1000).toFixed(2)} / ${(r.longueur_m / 1000).toFixed(2)}</td>
        <td><span class="mini"><i style="width:${t}%;background:${col}"></i></span><b style="color:${col}">${t} %</b></td>
        <td><span class="badge" style="background:${r.conforme ? '#16a34a' : '#BD171E'}">${r.conforme ? 'Conforme' : 'Non conforme'}</span>
          <br><small>seuil ${r.seuil ?? 90} %${r.sens_strict ? ' · sens' : ''}</small></td>
      </tr>`; }).join('')}</tbody></table>`;
  $('rRes').querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => openInCircuits(repRows[+tr.dataset.i]));
}

function openInCircuits(r) {
  document.querySelector('.tabs button[data-tab="circ"]').click();
  $('cCirc').value = r.circuit_id;
  showCircuit();
  if (![...$('cDev').options].some((o) => o.value === r.imei)) $('cDev').insertAdjacentHTML('beforeend', `<option value="${r.imei}">${r.imei}</option>`);
  $('cDev').value = r.imei;
  $('cDate').value = r.jour;
  $('cFrom').value = (r.heure_debut || '00:00').slice(0, 5);
  $('cTo').value = (r.heure_fin || '23:59').slice(0, 5);
  $('cTol').value = r.tolerance || 20;
  $('cSens').checked = !!r.sens_strict;
  calcCircuit();
}

async function recalcReport() {
  const d0 = new Date($('rFrom').value + 'T12:00:00'), d1 = new Date($('rTo').value + 'T12:00:00');
  const days = [];
  for (let d = new Date(d0); d <= d1 && days.length < 62; d.setDate(d.getDate() + 1)) days.push(isoDay(d));
  for (let i = 0; i < days.length; i++) {
    $('rRes').innerHTML = `<p class="msg">Calcul du ${fmtDay(days[i])} (${i + 1}/${days.length})…</p>`;
    const { error } = await sb.rpc('calculer_realisations', { p_date: days[i] });
    if (error) return showErr('Erreur calcul : ' + error.message);
  }
  loadReport();
}

function exportCsv() {
  if (!repRows.length) return;
  const head = ['Date', 'Circuit', 'Nom circuit', 'Véhicule', 'IMEI', 'Shift', 'Début planifié', 'Fin planifiée',
    '1er passage', 'Dernier passage', 'Longueur (km)', 'Réalisé (km)', 'Taux (%)', 'Seuil (%)', 'Statut'];
  const lines = repRows.map((r) => [r.jour, r.circuit_code, r.circuit_name || '', r.vehicule || r.plate || '', r.imei, r.shift || '',
    (r.heure_debut || '').slice(0, 5), (r.heure_fin || '').slice(0, 5),
    r.t_debut ? fmtHour(r.t_debut) : '', r.t_fin ? fmtHour(r.t_fin) : '',
    (r.longueur_m / 1000).toFixed(3).replace('.', ','), (r.realise_m / 1000).toFixed(3).replace('.', ','),
    String(r.taux).replace('.', ','), r.seuil ?? 90, r.conforme ? 'Conforme' : 'Non conforme']);
  const csv = '﻿' + [head, ...lines].map((l) => l.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `taux_realisation_${$('rFrom').value}_${$('rTo').value}.csv`;
  a.click();
}

      <td>${p.shift || ''}</td>
      <td>${p.heure_debut.slice(0, 5)} → ${p.heure_fin.slice(0, 5)}${p.heure_fin < p.heure_debut ? ' (J+1)' : ''}</td>
      <td class="days">${JOURS.map(([k, l]) => `<span class="${p[k] ? 'on' : ''}">${l}</span>`).join('')}</td>
      <td>${p.tolerance} m</td>
      <td>${p.actif ? '✅' : '—'}</td>
      <td><button class="btn2" style="padding:5px 10px" data-edit="${i}">Modifier</button></td></tr>`).join('')}</tbody></table>`
    : '<p class="msg">Aucune affectation pour l\'instant.</p>'}`;
  $('pAdd').onclick = () => planForm(null);
  $('rPlan').querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => planForm(planRows[+b.dataset.edit]));
}

function planForm(p) {
  const n = !p;
  p = p || { circuit_code: '', imei: '', shift: '', heure_debut: '06:00', heure_fin: '14:00',
    lun: true, mar: true, mer: true, jeu: true, ven: true, sam: true, dim: false, tolerance: 20, actif: true };
  const cOpts = [...circuits.values()].map((c) => `<option value="${c.code}"${c.code === p.circuit_code ? ' selected' : ''}>${c.code}${c.name && c.name !== c.code ? ' — ' + c.name : ''}</option>`).join('');
  const dOpts = [...devices.values()].map((d) => `<option value="${d.imei}"${d.imei === p.imei ? ' selected' : ''}>${label(d)}</option>`).join('');
  $('planForm').innerHTML = `
    <div class="stat" style="padding:16px;margin-bottom:16px;max-width:760px">
      <b style="font-size:16px;margin-bottom:10px">${n ? 'Nouvelle affectation' : 'Modifier l\'affectation'}</b>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">
        <label>Circuit<select id="fCirc">${cOpts}</select></label>
        <label>Véhicule<select id="fDev">${dOpts}</select></label>
        <label>Shift<input id="fShift" value="${p.shift || ''}" placeholder="Matin, Nuit…"></label>
        <label>Début<input type="time" id="fDeb" value="${p.heure_debut.slice(0, 5)}"></label>
        <label>Fin<input type="time" id="fFin" value="${p.heure_fin.slice(0, 5)}"></label>
        <label>Tolérance (m)<input type="number" id="fTol" value="${p.tolerance}" min="5" max="100" step="5"></label>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 12px">
        ${JOURS.map(([k], i) => `<label class="chk"><input type="checkbox" id="f_${k}"${p[k] ? ' checked' : ''}>${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'][i]}</label>`).join('')}
        <label class="chk"><input type="checkbox" id="fActif"${p.actif ? ' checked' : ''}>Actif</label>
      </div>
      <p class="msg" style="margin:0 0 10px">Si l'heure de fin est avant l'heure de début, le shift se termine le lendemain.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end">
        <label style="margin:0;max-width:160px">Code admin<input type="password" id="fPin" value="${getPin()}"></label>
        <button class="btn" style="width:auto;padding:9px 16px" id="fSave">Enregistrer</button>
        <button class="btn2" id="fCancel">Annuler</button>
        ${n ? '' : '<button class="btn2" style="border-color:#BD171E;color:#BD171E" id="fDel">Supprimer</button>'}
      </div>
      <div id="fMsg" class="msg"></div>
    </div>`;
  $('planForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('fCancel').onclick = () => { $('planForm').innerHTML = ''; };
  $('fSave').onclick = async () => {
    const body = { id: n ? '' : String(p.id), circuit_code: $('fCirc').value, imei: $('fDev').value, shift: $('fShift').value,
      heure_debut: $('fDeb').value, heure_fin: $('fFin').value, tolerance: +$('fTol').value || 20, actif: $('fActif').checked };
    JOURS.forEach(([k]) => { body[k] = $('f_' + k).checked; });
    if (!body.circuit_code || !body.imei) { $('fMsg').textContent = 'Choisis un circuit et un véhicule.'; return; }
    $('fMsg').textContent = 'Enregistrement…';
    const { error } = await sb.rpc('planning_save', { p_pin: $('fPin').value, p: body });
    if (error) { $('fMsg').innerHTML = `<span style="color:#BD171E">${error.message}</span>`; return; }
    setPin($('fPin').value);
    loadPlanning();
  };
  if (!n) $('fDel').onclick = async () => {
    const { data, error } = await sb.rpc('planning_delete', { p_pin: $('fPin').value, p_id: p.id });
    if (error) { $('fMsg').innerHTML = `<span style="color:#BD171E">${error.message}</span>`; return; }
    setPin($('fPin').value);
    await loadPlanning();
    if (data === 'desactive') $('rPlan').insertAdjacentHTML('afterbegin',
      '<p class="msg">Affectation <b>désactivée</b> : elle a déjà des résultats, l\'historique est conservé.</p>');
  };
}

// ---------- Interface ----------
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  const tab = b.dataset.tab;
  const layers = { live: fleetLayer, hist: histLayer, circ: circLayer, rep: null };
  for (const k in layers) {
    $('tab-' + k).hidden = k !== tab;
    if (!layers[k]) continue;
    if (k === tab) layers[k].addTo(map); else map.removeLayer(layers[k]);
  }
  $('map').hidden = tab === 'rep';
  $('report').hidden = tab !== 'rep';
  if (tab === 'rep') { if (!repLoaded) loadReport(); }
  else map.invalidateSize();
  if (tab === 'circ' && !circLayer.getLayers().length) showCircuit();
});
$('search').oninput = renderList;
$('hGo').onclick = loadHistory;
$('hSlider').oninput = (e) => moveCursor(+e.target.value);
$('hDate').value = $('cDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
$('cCirc').onchange = showCircuit;
$('cGo').onclick = calcCircuit;
{
  const y = new Date(); y.setDate(y.getDate() - 1);
  const w = new Date(); w.setDate(w.getDate() - 7);
  $('rFrom').value = isoDay(w); $('rTo').value = isoDay(y);
}
$('rGo').onclick = loadReport;
$('rCalc').onclick = recalcReport;
$('rCsv').onclick = exportCsv;
document.querySelectorAll('.rep-tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.rep-tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('rRes').hidden = b.dataset.r !== 'res';
  $('rPlan').hidden = b.dataset.r !== 'plan';
  if (b.dataset.r === 'plan') loadPlanning();
});

// ---------- Démarrage (avec connexion) ----------
let started = false, liveChannel = null;
function startApp(session) {
  $('login').hidden = true;
  $('userbar').hidden = false;
  $('userMail').textContent = session.user.email;
  if (started) return;
  started = true;
  loadFleet(true);
  loadCircuits();
  liveChannel = sb.channel('positions-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'positions' }, (payload) => {
      updatePos(payload.new);
      renderList();
      if (!$('hDev').options.length || ![...$('hDev').options].some((o) => o.value === payload.new.imei)) fillHistSelect();
    })
    .subscribe((st) => {
      const on = st === 'SUBSCRIBED';
      $('live').textContent = on ? '● Temps réel' : '● Reconnexion…';
      $('live').classList.toggle('on', on);
    });
  setInterval(renderList, 60000);                          // « il y a X min » et statuts
  setInterval(() => started && loadFleet(false), 300000);  // resynchronisation toutes les 5 min
}
function showLogin(msg) {
  $('login').hidden = false;
  $('userbar').hidden = true;
  $('loginErr').textContent = msg || '';
  setTimeout(() => $('lEmail').focus(), 50);
}

if (SUPABASE_ANON_KEY.startsWith('COLLE_ICI')) {
  showErr('Configure SUPABASE_ANON_KEY en haut du fichier index.html.');
  $('live').textContent = '● Non configuré';
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    $('lGo').disabled = true;
    $('loginErr').textContent = 'Connexion…';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
    $('lGo').disabled = false;
    if (error) {
      $('loginErr').textContent = /invalid/i.test(error.message) ? 'Email ou mot de passe incorrect.' : error.message;
      return;
    }
    $('lPass').value = '';
    startApp(data.session);
  };

  $('logout').onclick = async () => {
    await sb.auth.signOut();
    location.reload(); // repart d'un écran propre
  };

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || (!session && started)) location.reload();
  });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) startApp(data.session);
    else showLogin();
  });
}
</script>
