<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS RABAT – Suivi GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #ffffff; --bg2: #f4f6f9; --text: #1f2937; --muted: #6b7280; --border: #e3e7ee;
    --accent: #2f6fbf; --accent-dark: #1d4f8f; --accent-text: #ffffff; --red: #BD171E;
    --move: #16a34a; --idle: #f59e0b; --stop: #2563eb; --off: #BD171E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Open Sans", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }
  body { display: flex; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }

  /* ---- Barre d'icônes ---- */
  #rail { width: 60px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; background: #fff;
    border-right: 1px solid var(--border); box-shadow: 2px 0 6px rgba(0,0,0,.05); z-index: 5; padding-bottom: 8px; }
  .rail-logo { width: 44px; height: 44px; border-radius: 50%; margin: 8px 0 10px; }
  .rb { position: relative; width: 60px; height: 50px; border: 0; background: none; cursor: pointer; color: var(--accent);
    display: flex; align-items: center; justify-content: center; }
  .rb svg { width: 28px; height: 28px; }
  .rb:hover { background: var(--bg2); }
  .rb.on { background: var(--accent); color: #fff; }
  .rb .tip { display: none; position: absolute; left: 64px; top: 50%; transform: translateY(-50%); background: #111827; color: #fff;
    padding: 5px 9px; border-radius: 4px; font-size: 13px; white-space: nowrap; z-index: 1000; }
  .rb:hover .tip { display: block; }
  .rail-sp { flex: 1; }
  .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; margin: 6px 0; }
  .live-dot.on { background: var(--move); box-shadow: 0 0 0 3px rgba(22,163,74,.2); }

  /* ---- Panneau latéral ---- */
  #side { width: 460px; flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--border);
    transition: margin-left .2s; z-index: 4; }
  body.side-closed #side { margin-left: -460px; }
  #sideToggle { position: absolute; left: 520px; top: 50%; transform: translateY(-50%); z-index: 1000; width: 22px; height: 48px;
    border: 1px solid var(--border); border-left: 0; background: #fff; border-radius: 0 6px 6px 0; cursor: pointer; color: var(--muted);
    box-shadow: 2px 0 4px rgba(0,0,0,.08); transition: left .2s; }
  body.side-closed #sideToggle { left: 60px; }
  .brandbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--red) 50%, var(--accent) 50%) 1; }
  .brandbar img { height: 38px; width: auto; }
  .brandbar span { font-weight: 600; color: var(--accent-dark); font-size: 15px; }
  section { overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
  .pad { padding: 14px 16px; }
  input, select { width: 100%; padding: 9px 11px; border: 1px solid #c9d2df; border-radius: 3px; background: #fff; color: var(--text); font-size: 14px; font-family: inherit; }
  input:focus, select:focus { outline: 2px solid #bcd3f1; border-color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  label input, label select { margin-top: 4px; }
  .btn { width: 100%; padding: 10px; border: 0; border-radius: 3px; background: var(--accent); color: var(--accent-text); font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn:hover { background: var(--accent-dark); }
  .btn2 { padding: 9px 14px; border: 1px solid var(--accent); border-radius: 3px; background: transparent; color: var(--accent); font-size: 14px; cursor: pointer; }
  .gbtn { padding: 8px 12px; border: 0; border-radius: 3px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 3px rgba(0,0,0,.25); }
  .gbtn:hover { background: var(--accent-dark); }
  .ibtn { border: 0; background: none; cursor: pointer; color: var(--accent); padding: 4px; display: inline-flex; }
  .ibtn svg { width: 22px; height: 22px; }
  .err { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 4px; font-size: 13px; margin: 10px 16px 0; }
  .msg { font-size: 13px; color: var(--muted); margin: 12px 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* onglets soulignés */
  .utabs { display: flex; margin: 14px 0 10px; }
  .utabs button { flex: 1; border: 0; background: none; padding: 10px; font-size: 16px; color: var(--accent); cursor: pointer; border-bottom: 3px solid transparent; }
  .utabs button.on { border-bottom-color: var(--accent); }

  /* arbre */
  .tree { font-size: 13px; }
  .tree .tools { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .tn { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: default; }
  .tn input { width: auto; margin: 0; }
  .tn .fold { width: 14px; color: var(--muted); cursor: pointer; user-select: none; text-align: center; }
  .tn svg { width: 15px; height: 15px; color: #374151; }
  .tn .cnt { color: var(--muted); }
  .tkids { margin-left: 22px; }
  .lv-actions { display: flex; justify-content: flex-end; padding: 12px 0; }

  /* résultats */
  .back { display: flex; align-items: center; gap: 6px; color: var(--accent-dark); font-weight: 700; font-size: 15px; cursor: pointer; padding: 14px 16px 4px; text-decoration: none; }
  .lv-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--muted); }
  .lv-bar select { width: auto; border: 0; font-weight: 700; color: var(--text); padding: 4px; }
  .lv-bar .sp { flex: 1; }
  .lv-meta { padding: 0 16px 6px; font-size: 13px; }
  .lv-meta small { display: block; color: var(--text); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 8px; font-size: 12px; color: var(--muted); }
  .chips span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .grp-h { display: flex; align-items: center; justify-content: space-between; background: var(--accent); color: #fff; padding: 9px 12px;
    font-weight: 700; cursor: pointer; margin-top: 2px; }
  .grp-h .n { background: #fff; color: var(--accent); border-radius: 10px; padding: 0 7px; font-size: 12px; margin-right: 6px; }
  .card { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .card:hover, .card.sel { background: #eef3fa; }
  .ring { width: 50px; height: 50px; border-radius: 50%; border: 3px solid; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #fff; }
  .ring svg { width: 26px; height: 26px; color: var(--accent-dark); }
  .card .info { flex: 1; min-width: 0; }
  .card .when { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .card .nm { font-weight: 700; font-size: 14px; margin: 2px 0; }
  .card .circ { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .pct { font-weight: 700; font-size: 13px; color: var(--move); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .card .pct svg { width: 18px; height: 18px; }
  .warn { color: #f59e0b; font-size: 13px; }
  .card-acts { display: flex; justify-content: center; gap: 18px; padding: 6px 0 8px; border-bottom: 1px solid var(--border); background: #eef3fa; }

  /* fiche véhicule */
  .det-head { display: flex; align-items: center; gap: 14px; background: var(--accent-dark); color: #fff; padding: 12px 14px; }
  .det-head .ring { border-width: 3px; }
  .det-head .t { flex: 1; min-width: 0; }
  .det-head b { font-size: 17px; display: block; }
  .det-head small { font-size: 13px; opacity: .9; }
  .det-head .x { border: 0; background: none; color: #fff; font-size: 26px; cursor: pointer; line-height: 1; }
  .det-tabs { display: flex; background: var(--accent-dark); }
  .det-tabs button { flex: 1; border: 0; background: none; color: #fff; padding: 10px 0; cursor: pointer; opacity: .8; }
  .det-tabs button svg { width: 22px; height: 22px; }
  .det-tabs button.on { background: var(--accent); opacity: 1; }
  .det-body { padding: 14px 16px; overflow-y: auto; flex: 1; background: var(--bg2); }
  .box { background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 14px 16px; margin-bottom: 12px; }
  .kv { width: 100%; border-collapse: collapse; font-size: 13px; }
  .kv td { padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .kv td:first-child { color: var(--muted); width: 42%; }
  .sum { display: flex; justify-content: space-between; font-size: 13px; color: #374151; margin: 4px 0 8px; }
  .tl { position: relative; margin: 8px 0 0 10px; padding-left: 0; }
  .tl:before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 3px; background: var(--accent-dark); }
  .tl-trip { position: relative; padding: 6px 0 10px; cursor: pointer; }
  .tl-trip:hover, .tl-trip.sel { background: #eef3fa; }
  .tl-trip h4 { margin: 4px 0 6px 40px; font-size: 14px; text-align: center; }
  .tl-ev { position: relative; padding: 3px 4px 3px 40px; font-size: 13px; color: #374151; }
  .tl-ev .ic { position: absolute; left: 1px; top: 2px; width: 23px; height: 23px; border-radius: 50%; background: #fff; border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 11px; }
  .tl-ev .ic.on { border-color: var(--move); color: var(--move); }
  .tl-ev .tm { color: var(--muted); }
  .tl-dur { padding: 6px 4px 6px 40px; font-size: 13px; color: #374151; }

  /* ---- Zone principale ---- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #mapwrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  #trips { height: 42%; min-height: 120px; display: flex; flex-direction: column; border-top: 1px solid var(--border); background: #fff; position: relative; }
  #trips.min { height: 34px; min-height: 0; }
  #trips.min .tr-scroll, #trips.min .tr-foot { display: none; }
  .drawer-handle { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 48px; height: 18px; border: 1px solid var(--border);
    border-bottom: 0; border-radius: 6px 6px 0 0; background: #fff; cursor: pointer; color: #374151; font-size: 12px; line-height: 14px; z-index: 2; }
  .tr-title { padding: 8px 12px; font-size: 13px; }
  .tr-scroll { flex: 1; overflow: auto; }
  .gtbl { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
  .gtbl th { position: sticky; top: 0; background: #fff; text-align: left; font-weight: 700; color: var(--accent-dark); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .gtbl tr.flt th { top: 29px; font-weight: 400; padding: 3px 4px; }
  .gtbl tr.flt input { padding: 3px 6px; font-size: 12px; border-radius: 2px; }
  .gtbl td { padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: normal; min-width: 70px; }
  .gtbl tbody tr { cursor: pointer; }
  .gtbl tbody tr:nth-child(even) td { background: #f8fafc; }
  .gtbl tbody tr:hover td, .gtbl tbody tr.sel td { background: #e7effa; }
  .tr-foot { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 13px; flex-wrap: wrap; }
  .tr-foot select { width: auto; padding: 3px 6px; }
  .tr-foot .sp { flex: 1; }
  .pager button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; }
  .pager button:disabled { color: #c0c6cf; cursor: default; }
  .pager b { display: inline-block; min-width: 22px; text-align: center; border: 1px solid var(--border); border-radius: 2px; margin: 0 4px; }

  /* ---- Rapports (anciens écrans) ---- */
  #report { position: absolute; inset: 0; overflow: auto; padding: 20px 24px; background: #fff; z-index: 1100; }
  #report h2 { margin: 0 0 12px; font-size: 20px; color: var(--accent-dark); }
  .rep-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 16px; }
  .rep-ctrl label { margin: 0; }
  .rep-ctrl .btn { width: auto; padding: 9px 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpis .stat b { font-size: 24px; }
  .rep-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .rep-tabs button { padding: 7px 14px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); border-radius: 3px; cursor: pointer; }
  .rep-tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: #fff; }
  .tbl td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--bg2); }
  .mini { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--bg2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .mini i { display: block; height: 100%; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff; }
  .days span { display: inline-block; width: 18px; text-align: center; border-radius: 4px; font-size: 11px; margin-right: 2px; background: var(--bg2); color: var(--muted); }
  .days span.on { background: var(--accent); color: #fff; }
  .chk { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .chk input { width: auto; margin: 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .stat { background: var(--bg2); border-radius: 4px; padding: 10px; }
  .stat b { display: block; font-size: 18px; }
  .stat small { color: var(--muted); font-size: 12px; }
  .gauge { text-align: center; margin: 16px 0 8px; }
  .gauge b { font-size: 44px; line-height: 1; }
  .bar { height: 10px; border-radius: 5px; background: var(--bg2); overflow: hidden; margin: 10px 0 14px; }
  .bar div { height: 100%; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  input[type=range] { accent-color: var(--accent); padding: 0; margin-top: 8px; }
  #hInfo { font-size: 13px; margin-top: 8px; }

  /* ---- Carte ---- */
  .vicon img { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; border: 3px solid;
    box-sizing: border-box; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .vdir { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
  .vdir i { position: absolute; left: 50%; top: -10px; margin-left: -7px; width: 0; height: 0;
    border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 10px solid; }
  .arrow svg { width: 16px; height: 16px; }
  .tarrow svg { width: 14px; height: 14px; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.5; }
  .leaflet-container img.leaflet-tile { mix-blend-mode: plus-lighter; }  /* supprime les fines lignes blanches entre les tuiles */

  /* ---- Connexion ---- */

  #login .lg-veil { position: fixed; inset: 0; background: rgba(28, 72, 128, .70); }
  #login .lg-box { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px 16px 70px; }
  #login .lg-logo { width: 330px; max-width: 80vw; height: auto; margin-bottom: 34px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
  #login form { width: 100%; max-width: 334px; color: #fff; }
  #login .lg-title { font-size: 17px; padding: 0 0 10px 10px; border-bottom: 1px solid rgba(255,255,255,.85); margin-bottom: 30px; }
  #login input { display: block; width: 100%; margin: 0 0 30px; padding: 10px 10px; border: 0; border-radius: 0;
    background: #e8eefb; color: #111827; font-size: 16px; }
  #login input:focus { outline: 2px solid #8fb6ea; }
  #login .lg-forgot { display: block; text-align: center; color: #fff; font-size: 16px; text-decoration: none; margin: -8px 0 14px; }
  #login .lg-forgot:hover { text-decoration: underline; }
  #login .lg-btn { display: block; width: 100%; padding: 10px; border: 0; border-radius: 2px; background: #2f6fbf; color: #fff;
    font-size: 16px; cursor: pointer; box-shadow: 0 2px 4px rgba(0,0,0,.35); }
  #login .lg-btn:hover { background: #3a7ccf; }
  #login .lg-btn:disabled { opacity: .7; cursor: wait; }
  #loginErr, #resetMsg { color: #fff; font-size: 14px; min-height: 20px; margin-top: 14px; text-align: center; }
  #loginErr.err-on, #resetMsg.err-on { color: #ffd1d3; }
  #login .lg-support { position: fixed; left: 12px; bottom: 12px; color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
  #login .lg-support:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    body { flex-direction: column; overflow: auto; }
    #rail { width: 100%; height: 52px; flex-direction: row; justify-content: flex-start; padding: 0 4px; border-right: 0; border-bottom: 1px solid var(--border); }
    .rail-logo { width: 36px; height: 36px; margin: 0 6px; }
    .rb { width: 48px; height: 52px; }
    .rb .tip { display: none !important; }
    .rail-sp { flex: 1; }
    #side { width: 100%; height: 48vh; border-right: 0; border-bottom: 1px solid var(--border); }
    body.side-closed #side { margin-left: 0; }
    #sideToggle { display: none; }
    #main { height: 70vh; flex: none; }
  }
</style>

function status(p) {

function ago(ts) {

  return fmtTime(ts);
}
// À l'arrêt, les points sont ramenés sur le 1er point de l'arrêt (anti-dérive) ; sauts > 150 km/h ignorés.
function cleanTrack(rows) {
  const out = [];
  let anchor = null;
  for (const p of rows) {
    if (!p.lat && !p.lng) continue;
    if ((p.speed || 0) <= 3) {
      if (!anchor) anchor = { lat: p.lat, lng: p.lng };
      out.push({ ...p, lat: anchor.lat, lng: anchor.lng });
    } else {
      anchor = null;
      const prev = out[out.length - 1];
      if (prev) {
        const h = (T(p) - T(prev)) / 3600000;
        if (dist(prev, p) / Math.max(h, 1 / 3600) > 150) continue;
      }
      out.push(p);
    }
  }
  return out;
}
function dist(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b) {
  const r = Math.PI / 180, y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function durTxt(min) {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? `${h} h ${pad2(m)}` : `${m} min`;
}
async function fetchPositions(imei, from, to, cols = 'ts,lat,lng,speed,ignition,angle') {
  let rows = [];
  for (let page = 0; ; page++) {
    const { data, error } = await sb.from('positions').select(cols).eq('imei', imei)
      .gte('ts', from.toISOString()).lt('ts', to.toISOString()).order('ts').range(page * 1000, page * 1000 + 999);
    if (error) { showErr('Erreur Supabase : ' + error.message); break; }
    rows = rows.concat(data);
    if (data.length < 1000) break;
  }
  return rows;
}

// Icône carte : logo SOS + anneau couleur du statut + flèche de direction en mouvement
function icon(p) {
  const s = status(p);
  const arrow = s === 'move'
    ? `<div class="vdir" style="transform:rotate(${p.angle || 0}deg)"><i style="border-bottom-color:${HEX[s]}"></i></div>` : '';
  return L.divIcon({ className: 'vicon', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20],
    html: `${arrow}<img src="${VEH_IMG}" alt="" style="border-color:${HEX[s]}">` });
}
// Batterie interne : IO 113 (%) sinon estimation depuis IO 67 (mV)
function battery(p) {
  const io = (p && p.io) || {};
  if (io['113'] !== undefined) return { pct: Math.min(100, Math.max(0, +io['113'])), est: false };
  if (io['67'] !== undefined && +io['67'] > 0) {
    const v = +io['67'] / 1000;
    return { pct: Math.round(Math.min(100, Math.max(0, (v - 3.5) / 0.6 * 100))), est: true, v };
  }
  return null;
}
function batteryHtml(p) {
  const b = battery(p);
  if (!b) return '';
  const col = b.pct > 50 ? '#16a34a' : b.pct > 20 ? '#f59e0b' : '#BD171E';
  return `<span style="white-space:nowrap" title="${b.est ? 'Estimé depuis la tension ' + b.v.toFixed(2) + ' V' : 'Niveau batterie (IO 113)'}">🔋 <b style="color:${col}">${b.est ? '≈' : ''}${b.pct} %</b></span>`;
}
function popup(d) {
  const p = d.last, bat = batteryHtml(p);
  return `<b>${esc(label(d))}</b>${d.plate && d.name ? ` — ${esc(d.plate)}` : ''}<br>
    ${LABELS[status(p)]} · ${p.speed} km/h<br>
    Contact : ${p.ignition === null || p.ignition === undefined ? '—' : p.ignition ? 'ON' : 'OFF'}${p.ext_voltage ? ` · Alim. ${p.ext_voltage.toFixed(1)} V` : ''}<br>
    ${bat ? `Batterie boîtier : ${bat}<br>` : ''}<small>${fmtTime(p.ts)} · ${p.satellites ?? '—'} satellites</small><br>
    <a href="#" onclick="openDetail('${d.imei}');return false">Ouvrir la fiche véhicule ›</a>`;
}

// ---------- Géocodage inverse (OpenStreetMap / Nominatim, 1 requête par seconde, avec cache) ----------
const GEO = { q: [], busy: false, cache: {} };
try { GEO.cache = JSON.parse(localStorage.getItem('sos_geo') || '{}'); } catch { GEO.cache = {}; }
const geoKey = (lat, lng) => `${(+lat).toFixed(4)},${(+lng).toFixed(4)}`;
function fmtAddr(d) {
  const a = (d && d.address) || {};
  const road = a.road || a.pedestrian || a.footway || a.square || a.neighbourhood || a.quarter || a.suburb || '';
  const city = a.city || a.town || a.village || a.municipality || a.county || '';
  return [a.house_number && road ? `${a.house_number}, ${road}` : road, city].filter(Boolean).join(', ');
}
function geocode(lat, lng) {
  const k = geoKey(lat, lng);
  if (GEO.cache[k]) return Promise.resolve(GEO.cache[k]);
  return new Promise((res) => { GEO.q.push({ k, lat, lng, res }); pumpGeo(); });
}
async function pumpGeo() {
  if (GEO.busy) return;
  GEO.busy = true;
  while (GEO.q.length) {
    const j = GEO.q.shift();
    if (GEO.cache[j.k]) { j.res(GEO.cache[j.k]); continue; }
    let txt = '';
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=fr&lat=${j.lat}&lon=${j.lng}`);
      txt = fmtAddr(await r.json());
    } catch { txt = ''; }
    if (txt) {
      GEO.cache[j.k] = txt;
      try { const keys = Object.keys(GEO.cache); if (keys.length > 3000) keys.slice(0, 500).forEach((x) => delete GEO.cache[x]); localStorage.setItem('sos_geo', JSON.stringify(GEO.cache)); } catch {}
    }
    j.res(txt || `${(+j.lat).toFixed(5)}, ${(+j.lng).toFixed(5)}`);
    await sleep(1100);
  }
  GEO.busy = false;
}
// Remplit tous les éléments [data-g="lat,lng"] de la page
function fillAddr(lat, lng, onDone) {
  const k = geoKey(lat, lng);
  geocode(lat, lng).then((txt) => {
    document.querySelectorAll(`[data-g="${k}"]`).forEach((el) => { el.textContent = txt; });
    if (onDone) onDone(txt);
  });
  return `<span data-g="${k}">${GEO.cache[k] ? esc(GEO.cache[k]) : '…'}</span>`;
}

// ---------- Flotte ----------
function upsertDevice(row) {
  const d = devices.get(row.imei) || { imei: row.imei };
  for (const k of ['name', 'plate', 'lot', 'categorie']) if (row[k] !== undefined) d[k] = row[k];
  devices.set(row.imei, d);
  return d;
}
function updatePos(p) {
  if (!p.lat && !p.lng) return;
  const d = upsertDevice({ imei: p.imei });
  if (d.last && new Date(p.ts) < new Date(d.last.ts)) return;
  d.last = p;
  if (!d.marker) d.marker = L.marker([p.lat, p.lng], { icon: icon(p) }).addTo(fleetLayer);
  d.marker.setLatLng([p.lat, p.lng]).setIcon(icon(p)).bindPopup(popup(d));
  if (detImei === p.imei) renderDetHead();
}
const lotOf = (d) => d.lot || 'LOT 1';
const catOf = (d) => d.categorie || 'Sans catégorie';

let sb;
async function loadFleet(first) {
  const [r1, r2] = await Promise.all([sb.from('devices').select('*'), sb.from('last_positions').select('*')]);
  if (r1.error || r2.error) return showErr('Erreur Supabase : ' + (r1.error || r2.error).message);
  r1.data.forEach(upsertDevice);
  r2.data.forEach(updatePos);
  renderTree();
  renderList();
  fillHistSelect();
  if (first) {
    const pts = [...devices.values()].filter((d) => d.last).map((d) => [d.last.lat, d.last.lng]);
    if (pts.length === 1) map.setView(pts[0], 15);
    else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40] });
  }
}
function fillHistSelect() {
  const opts = [...devices.values()].sort((a, b) => label(a).localeCompare(label(b), 'fr', { numeric: true }))
    .map((d) => `<option value="${d.imei}">${esc(label(d))}</option>`).join('');
  for (const id of ['hDev', 'cDev']) { const cur = $(id).value; $(id).innerHTML = opts; if (cur) $(id).value = cur; }
}

// ---------- Arbre Lot > Catégorie ----------
const sel = new Set();          // clés cochées : "lot" ou "lot|cat"
const folded = new Set();       // lots repliés
let searchDone = false;         // true après « Recherche temps réel »
const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg>';
function treeData() {
  const lots = {};
  for (const d of devices.values()) {
    const l = lotOf(d), c = catOf(d);
    lots[l] = lots[l] || {};
    lots[l][c] = (lots[l][c] || 0) + 1;
  }
  return lots;
}
function renderTree() {
  const lots = treeData();
  const total = devices.size;
  const lotNames = Object.keys(lots).sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  let h = `<div class="tools"><span class="msg" style="margin:0">Aucune case cochée = toute la flotte</span>
    <button class="ibtn" id="treeAll" title="Tout déplier / replier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h6M4 5v14M4 12h5M4 19h5M13 12h7M13 5h7M13 19h7"/></svg></button></div>
    <div class="tn"><span class="fold"></span><input type="checkbox" data-k="*" ${sel.has('*') ? 'checked' : ''}><b>&lt;&gt;</b><span class="cnt">(${total})</span></div><div class="tkids">`;
  for (const l of lotNames) {
    const cats = Object.keys(lots[l]).sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
    const n = cats.reduce((a, c) => a + lots[l][c], 0);

// ---------- Circuit en cours + % de réalisation (pour les cartes véhicules) ----------
let livePlans = [];
const liveRates = new Map(); // imei -> { code, start, taux }
const DOW = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
function activePlan(imei, now = new Date()) {
  for (const p of livePlans) {
    if (p.imei !== imei || !p.actif) continue;
    for (const off of [0, -1]) {
      const d = new Date(now); d.setDate(d.getDate() + off);
      if (!p[DOW[d.getDay()]]) continue;
      const day = isoDay(d);
      const s = new Date(`${day}T${p.heure_debut.slice(0, 8)}`);
      const e = new Date(`${day}T${p.heure_fin.slice(0, 8)}`);
      if (e <= s) e.setDate(e.getDate() + 1);
      if (now >= s && now <= e) return { p, s, e };
    }
  }
  return null;
}
async function loadLiveRates() {
  const { data, error } = await sb.from('planning_list').select('*').eq('actif', true);
  if (error) return;
  livePlans = data;
  const jobs = [];
  for (const d of devices.values()) {
    const a = activePlan(d.imei);
    if (!a) { liveRates.delete(d.imei); continue; }
    jobs.push(async () => {
      const { data: r } = await sb.rpc('circuit_realisation', { p_circuit: a.p.circuit_id, p_imei: d.imei,
        p_from: a.s.toISOString(), p_to: new Date().toISOString(), p_tol: a.p.tolerance || 20, p_sens: false, p_geojson: false });
      liveRates.set(d.imei, { code: a.p.circuit_code, start: a.s, end: a.e, plan: a.p, taux: r ? Number(r.taux || 0) : null });
    });
  }
  for (let i = 0; i < jobs.length; i += 4) await Promise.all(jobs.slice(i, i + 4).map((f) => f()));
  renderList();
  if (detImei) renderDetHead();
}

// Découpage en parcours : un arrêt = immobile ≥ 60 s, ou trou de données > 5 min
function computeTrips(pts) {
  if (pts.length < 2) return [];
  const STOP_MS = 60000, GAP_MS = 5 * 60000;
  let runs = [];
  pts.forEach((p, i) => {
    const m = (p.speed || 0) > 3;
    const gap = i > 0 && T(p) - T(pts[i - 1]) > GAP_MS;
    let r = runs[runs.length - 1];
    if (gap && r && r.m) { runs.push({ m: false, s: i - 1, e: i - 1, gap: true }); r = runs[runs.length - 1]; }
    if (r && !r.m && gap) r.gap = true;                 // l'arrêt couvre un trou de données
    if (r && r.m === m && !gap) r.e = i;
    else if (r && !r.m && !m) r.e = i;
    else runs.push({ m, s: i, e: i, gap: false });
  });
  // petits arrêts (< 60 s) entre deux roulages : fusionnés dans le trajet
  for (let k = 1; k < runs.length - 1; k++) {
    const r = runs[k];
    if (!r.m && !r.gap && runs[k - 1].m && runs[k + 1].m && T(pts[runs[k + 1].s]) - T(pts[r.s]) < STOP_MS) r.m = true;
  }
  const merged = [];
  runs.forEach((r) => { const l = merged[merged.length - 1]; if (l && l.m === r.m) l.e = r.e; else merged.push({ ...r }); });
  runs = merged;

  const trips = [];
  runs.forEach((r, k) => {
    if (!r.m) return;
    const prev = runs[k - 1], next = runs[k + 1];
    const si = prev ? (prev.gap ? r.s : prev.e) : r.s, ei = next ? next.s : r.e;
    const seg = pts.slice(si, ei + 1);
    let km = 0, vmax = 0;
    for (let i = 1; i < seg.length; i++) { if (T(seg[i]) - T(seg[i - 1]) <= GAP_MS) km += dist(seg[i - 1], seg[i]); vmax = Math.max(vmax, seg[i].speed || 0); }
    if (km < 0.05) return;
    // contact ON pendant l'arrêt précédent
    let contactOn = null;
    const from = prev ? prev.s : r.s;
    for (let i = Math.max(1, from); i <= r.s; i++) if (pts[i].ignition && pts[i - 1].ignition === false) contactOn = pts[i].ts;
    trips.push({ n: trips.length + 1, start: pts[si], end: pts[ei], pts: seg, km, vmax, contactOn,
      stopBefore: prev ? (T(pts[si]) - T(pts[prev.s])) / 1000 : 0, dur: (T(pts[ei]) - T(pts[si])) / 1000,
      enCours: !next && Date.now() - T(pts[ei]) < OFFLINE_MIN * 60000, addrS: '', addrE: '' });
  });
  return trips;
}

    <div class="tl">${detTrips.map((t) => `<div class="tl-trip" data-n="${t.n}">

      <div class="tl-ev"><span class="ic">▶</span><span class="tm">${fmtHMS(t.start.ts)}</span><br>Départ ${fillAddr(t.start.lat, t.start.lng, (a) => { t.addrS = a; })}</div>

      <div class="tl-ev"><span class="ic">⚑</span><span class="tm">${fmtHMS(t.end.ts)}</span><br>${t.enCours ? 'Dernière position' : 'Arrivée'} ${fillAddr(t.end.lat, t.end.lng, (a) => { t.addrE = a; })}</div>

  ['adep', 'Adresse départ', (t) => t.addrS || GEO.cache[geoKey(t.start.lat, t.start.lng)] || ''],
  ['duree', 'Durée', (t) => fmtDur(t.dur)],
  ['km', 'Distance (km)', (t) => t.km.toFixed(2)],
  ['vmax', 'Vit. max (km/h)', (t) => t.vmax],
  ['arrivee', 'Arrivée', (t) => fmtHMS(t.end.ts)],
  ['aarr', 'Adresse arrivée', (t) => t.addrE || GEO.cache[geoKey(t.end.lat, t.end.lng)] || ''],
];
let tPage = 0, tFilters = {};

  return detTrips.filter((t) => TCOLS.every(([k, , f]) => !tFilters[k] || String(f(t)).toLowerCase().includes(tFilters[k].toLowerCase())));

function renderTripsTable(rebuildHead) {

  }

// ---------- Historique ----------
let histPts = [], cursor = null;
async function loadHistory() {
  const imei = $('hDev').value, day = $('hDate').value;
  if (!imei || !day) return;
  $('hStats').innerHTML = '<p class="msg">Chargement…</p>';
  const from = new Date(`${day}T${$('hFrom').value || '00:00'}:00`);
  const to = new Date(`${day}T${$('hTo').value || '23:59'}:59`);
  if (to <= from) to.setDate(to.getDate() + 1); // plage qui passe minuit
  let rows = [];
  for (let page = 0; ; page++) {
    const { data, error } = await sb.from('positions')
      .select('ts,lat,lng,speed,ignition,angle')
      .eq('imei', imei).gte('ts', from.toISOString()).lt('ts', to.toISOString())
      .order('ts').range(page * 1000, page * 1000 + 999);
    if (error) return showErr('Erreur Supabase : ' + error.message);
    rows = rows.concat(data);
    if (data.length < 1000) break;
  }
  histPts = cleanTrack(rows);
  histLayer.clearLayers();
  cursor = null;
  $('hSlider').hidden = true;
  $('hInfo').textContent = '';
  if (!histPts.length) { $('hStats').innerHTML = '<p class="msg">Aucune donnée sur cette période.</p>'; return; }

  // Distance, vitesse max, temps de conduite
  let km = 0, vmax = 0, driveMin = 0;
  for (let i = 1; i < histPts.length; i++) {
    const a = histPts[i - 1], b = histPts[i];
    const dt = (new Date(b.ts) - new Date(a.ts)) / 60000;
    if (a.speed > 3 || b.speed > 3) km += dist(a, b);
    if (a.speed > 3) driveMin += Math.min(dt, 5);
  }
  histPts.forEach((p) => { vmax = Math.max(vmax, p.speed); });

  // Arrêts de 5 min ou plus
  const stops = [];
  for (let i = 0; i < histPts.length;) {
    if (histPts[i].speed <= 3) {
      let j = i;
      while (j + 1 < histPts.length && histPts[j + 1].speed <= 3) j++;
      const end = j + 1 < histPts.length ? histPts[j + 1].ts : histPts[j].ts;
      const dur = (new Date(end) - new Date(histPts[i].ts)) / 60000;
      if (dur >= 5) stops.push({ p: histPts[i], from: histPts[i].ts, to: end, dur });
      i = j + 1;
    } else i++;
  }

  const line = L.polyline(histPts.map((p) => [p.lat, p.lng]), { color: '#2468B0', weight: 4 }).addTo(histLayer);
  const first = histPts[0], last = histPts[histPts.length - 1];
  L.circleMarker([first.lat, first.lng], { radius: 8, color: '#fff', fillColor: '#16a34a', fillOpacity: 1, weight: 2 })
    .bindPopup(`Départ ${fmtHour(first.ts)}`).addTo(histLayer);
  L.circleMarker([last.lat, last.lng], { radius: 8, color: '#fff', fillColor: '#BD171E', fillOpacity: 1, weight: 2 })
    .bindPopup(`Arrivée ${fmtHour(last.ts)}`).addTo(histLayer);
  stops.forEach((s, k) => L.circleMarker([s.p.lat, s.p.lng], { radius: 7, color: '#fff', fillColor: '#2563eb', fillOpacity: 1, weight: 2 })
    .bindPopup(`Arrêt ${k + 1}<br>${fmtHour(s.from)} → ${fmtHour(s.to)}<br>${durTxt(s.dur)}`).addTo(histLayer));
  map.fitBounds(line.getBounds(), { padding: [40, 40] });

  $('hStats').innerHTML = `<div class="stats">
      <div class="stat"><b>${km.toFixed(1)} km</b><small>Distance</small></div>
      <div class="stat"><b>${durTxt(driveMin)}</b><small>Temps de conduite</small></div>
      <div class="stat"><b>${vmax} km/h</b><small>Vitesse max</small></div>
      <div class="stat"><b>${stops.length}</b><small>Arrêts ≥ 5 min</small></div>
    </div><p class="msg">${fmtHour(first.ts)} → ${fmtHour(last.ts)} · ${histPts.length} points</p>`;
  $('hSlider').max = histPts.length - 1;
  $('hSlider').value = 0;
  $('hSlider').hidden = false;
  moveCursor(0);
}
function moveCursor(i) {
  const p = histPts[i];
  if (!p) return;
  if (!cursor) cursor = L.marker([p.lat, p.lng], { icon: icon({ ...p, ts: new Date().toISOString(), speed: Math.max(p.speed, 4) }) }).addTo(histLayer);
  cursor.setLatLng([p.lat, p.lng]).setIcon(icon({ ...p, ts: new Date().toISOString(), speed: Math.max(p.speed, 4) }));
  $('hInfo').textContent = `${fmtTime(p.ts)} · ${p.speed} km/h · contact ${p.ignition ? 'ON' : 'OFF'}`;
}

const circuits = new Map();
async function loadCircuits() {
  const { data, error } = await sb.from('circuits_list').select('*').order('code');
  if (error) return; // table pas encore créée
  data.forEach((c) => circuits.set(String(c.id), c));
  renderCircTree();
  $('cCirc').innerHTML = data.map((c) => `<option value="${c.id}">${c.code || ''}${c.name ? ' — ' + c.name : ''} (${c.km} km)</option>`).join('');
}
function showCircuit() {
  const c = circuits.get($('cCirc').value);
  circLayer.clearLayers();
  $('cRes').innerHTML = '';
  if (!c) return;
  $('cSens').checked = !!c.sens_strict;
  const l = L.geoJSON(c.geojson, { style: { color: '#6b7280', weight: 6, opacity: 0.7, dashArray: '8 6' } }).addTo(circLayer);
  map.fitBounds(l.getBounds(), { padding: [40, 40] });
}
async function calcCircuit() {
  const c = circuits.get($('cCirc').value), imei = $('cDev').value, day = $('cDate').value;
  if (!c || !imei || !day) return;
  const from = new Date(`${day}T${$('cFrom').value || '00:00'}:00`);
  const to = new Date(`${day}T${$('cTo').value || '23:59'}:59`);
  if (to <= from) to.setDate(to.getDate() + 1); // shift de nuit
  $('cRes').innerHTML = '<p class="msg">Calcul en cours…</p>';
  const { data: r, error } = await sb.rpc('circuit_realisation', {
    p_circuit: +c.id, p_imei: imei, p_from: from.toISOString(), p_to: to.toISOString(), p_tol: +$('cTol').value || 20,
    p_sens: $('cSens').checked,
  });
  if (error) { $('cRes').innerHTML = ''; return showErr('Erreur calcul : ' + error.message); }
  circLayer.clearLayers();
  const seg = L.geoJSON(r.segments, {
    style: (f) => ({ color: f.properties.ok ? '#16a34a' : '#BD171E', weight: 7, opacity: 0.9, lineCap: 'butt' }),
  }).addTo(circLayer);
  map.fitBounds(seg.getBounds(), { padding: [40, 40] });

  // Flèches du sens du circuit (tous les ~100 m) quand le sens est vérifié
  if (r.sens) {
    r.segments.features.forEach((ft, i) => {
      if (i % 4 !== 2) return;
      const [[x1, y1], [x2, y2]] = ft.geometry.coordinates;
      L.marker([(y1 + y2) / 2, (x1 + x2) / 2], { interactive: false, icon: L.divIcon({
        className: 'arrow', iconSize: [16, 16], iconAnchor: [8, 8],
        html: `<svg viewBox="0 0 16 16" style="transform:rotate(${ft.properties.az}deg)"><path d="M8 1 L14 14 L8 10.5 L2 14 Z" fill="#111827" stroke="#fff" stroke-width="1.2"/></svg>` }) }).addTo(circLayer);
    });
  }

  // Tracé GPS réel du véhicule sur la période (coupé si plus de 3 min sans point)
  let rows = [];
  for (let page = 0; ; page++) {
    const { data, error: e2 } = await sb.from('positions')
      .select('ts,lat,lng,speed').eq('imei', imei)
      .gte('ts', from.toISOString()).lt('ts', to.toISOString())
      .order('ts').range(page * 1000, page * 1000 + 999);
    if (e2 || !data) break;
    rows = rows.concat(data);
    if (data.length < 1000) break;
  }
  const lines = [];
  let cur = [];
  cleanTrack(rows).forEach((p, i, arr) => {
    if (i && new Date(p.ts) - new Date(arr[i - 1].ts) > 3 * 60000) { if (cur.length > 1) lines.push(cur); cur = []; }
    cur.push([p.lat, p.lng]);
  });
  if (cur.length > 1) lines.push(cur);
  if (lines.length) {
    L.polyline(lines, { color: '#2468B0', weight: 3, opacity: 0.95, dashArray: '6 5' })
      .bindTooltip('Tracé GPS du véhicule', { sticky: true }).addTo(circLayer);
  }
  const t = Number(r.taux ?? 0);
  const col = t >= 90 ? '#16a34a' : t >= 70 ? '#f59e0b' : '#BD171E';
  const manque = (r.longueur_m - r.realise_m) / 1000;
  $('cRes').innerHTML = `
    <div class="gauge"><b style="color:${col}">${t} %</b><div class="msg" style="margin:4px 0 0">Taux de réalisation</div></div>
    <div class="bar"><div style="width:${t}%;background:${col}"></div></div>
    <div class="stats">
      <div class="stat"><b>${(r.realise_m / 1000).toFixed(2)} km</b><small>Réalisé</small></div>
      <div class="stat"><b>${manque.toFixed(2)} km</b><small>Non réalisé</small></div>
      <div class="stat"><b>${r.t_debut ? fmtHour(r.t_debut) : '—'}</b><small>Entrée sur circuit</small></div>
      <div class="stat"><b>${r.t_fin ? fmtHour(r.t_fin) : '—'}</b><small>Dernier passage</small></div>
    </div>
    <div class="legend"><span><i style="background:#16a34a"></i>Réalisé</span><span><i style="background:#BD171E"></i>Non réalisé</span><span><i style="background:#2468B0"></i>Tracé GPS</span></div>
    ${r.sens ? '<p class="msg">▲ Sens du circuit vérifié : un passage dans le mauvais sens ne compte pas.</p>' : ''}`;
}

function openInCircuits(r) {

async function recalcReport() {
  const d0 = new Date($('rFrom').value + 'T12:00:00'), d1 = new Date($('rTo').value + 'T12:00:00');
  const days = [];
  for (let d = new Date(d0); d <= d1 && days.length < 62; d.setDate(d.getDate() + 1)) days.push(isoDay(d));
  for (let i = 0; i < days.length; i++) {
    $('rRes').innerHTML = `<p class="msg">Calcul du ${fmtDay(days[i])} (${i + 1}/${days.length})…</p>`;
    const { error } = await sb.rpc('calculer_realisations', { p_date: days[i] });
    if (error) return showErr('Erreur calcul : ' + error.message);
  }
  loadReport();
}

    : '<p class="msg">Aucune affectation pour l\'instant.</p>'}`;
  $('pAdd').onclick = () => planForm(null);
  $('rPlan').querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => planForm(planRows[+b.dataset.edit]));
}

function planForm(p) {
  const n = !p;
  p = p || { circuit_code: '', imei: '', shift: '', heure_debut: '06:00', heure_fin: '14:00',
    lun: true, mar: true, mer: true, jeu: true, ven: true, sam: true, dim: false, tolerance: 20, actif: true };
  const cOpts = [...circuits.values()].map((c) => `<option value="${c.code}"${c.code === p.circuit_code ? ' selected' : ''}>${c.code}${c.name && c.name !== c.code ? ' — ' + c.name : ''}</option>`).join('');
  const dOpts = [...devices.values()].map((d) => `<option value="${d.imei}"${d.imei === p.imei ? ' selected' : ''}>${label(d)}</option>`).join('');
  $('planForm').innerHTML = `
    <div class="stat" style="padding:16px;margin-bottom:16px;max-width:760px">
      <b style="font-size:16px;margin-bottom:10px">${n ? 'Nouvelle affectation' : 'Modifier l\'affectation'}</b>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">
        <label>Circuit<select id="fCirc">${cOpts}</select></label>
        <label>Véhicule<select id="fDev">${dOpts}</select></label>
        <label>Shift<input id="fShift" value="${p.shift || ''}" placeholder="Matin, Nuit…"></label>
        <label>Début<input type="time" id="fDeb" value="${p.heure_debut.slice(0, 5)}"></label>
        <label>Fin<input type="time" id="fFin" value="${p.heure_fin.slice(0, 5)}"></label>
        <label>Tolérance (m)<input type="number" id="fTol" value="${p.tolerance}" min="5" max="100" step="5"></label>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 12px">
        ${JOURS.map(([k], i) => `<label class="chk"><input type="checkbox" id="f_${k}"${p[k] ? ' checked' : ''}>${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'][i]}</label>`).join('')}
        <label class="chk"><input type="checkbox" id="fActif"${p.actif ? ' checked' : ''}>Actif</label>
      </div>
      <p class="msg" style="margin:0 0 10px">Si l'heure de fin est avant l'heure de début, le shift se termine le lendemain.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end">
        <label style="margin:0;max-width:160px">Code admin<input type="password" id="fPin" value="${getPin()}"></label>
        <button class="btn" style="width:auto;padding:9px 16px" id="fSave">Enregistrer</button>
        <button class="btn2" id="fCancel">Annuler</button>
        ${n ? '' : '<button class="btn2" style="border-color:#BD171E;color:#BD171E" id="fDel">Supprimer</button>'}
      </div>
      <div id="fMsg" class="msg"></div>
    </div>`;
  $('planForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('fCancel').onclick = () => { $('planForm').innerHTML = ''; };
  $('fSave').onclick = async () => {
    const body = { id: n ? '' : String(p.id), circuit_code: $('fCirc').value, imei: $('fDev').value, shift: $('fShift').value,
      heure_debut: $('fDeb').value, heure_fin: $('fFin').value, tolerance: +$('fTol').value || 20, actif: $('fActif').checked };
    JOURS.forEach(([k]) => { body[k] = $('f_' + k).checked; });
    if (!body.circuit_code || !body.imei) { $('fMsg').textContent = 'Choisis un circuit et un véhicule.'; return; }
    $('fMsg').textContent = 'Enregistrement…';
    const { error } = await sb.rpc('planning_save', { p_pin: $('fPin').value, p: body });
    if (error) { $('fMsg').innerHTML = `<span style="color:#BD171E">${error.message}</span>`; return; }
    setPin($('fPin').value);
    loadPlanning();
  };
  if (!n) $('fDel').onclick = async () => {
    const { data, error } = await sb.rpc('planning_delete', { p_pin: $('fPin').value, p_id: p.id });
    if (error) { $('fMsg').innerHTML = `<span style="color:#BD171E">${error.message}</span>`; return; }
    setPin($('fPin').value);
    await loadPlanning();
    if (data === 'desactive') $('rPlan').insertAdjacentHTML('afterbegin',
      '<p class="msg">Affectation <b>désactivée</b> : elle a déjà des résultats, l\'historique est conservé.</p>');
  };
}

// ---------- Interface ----------
let curTab = 'live';
document.querySelectorAll('.rb[data-tab]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.rb[data-tab]').forEach((x) => x.classList.toggle('on', x === b));
  const tab = curTab = b.dataset.tab;
  ['live', 'hist', 'circ', 'rep'].forEach((k) => { $('tab-' + k).hidden = k !== tab; });
  // calques de la carte
  const want = {
    live: detImei ? [detLayer, overlayCirc] : [fleetLayer, overlayCirc],
    hist: [histLayer], circ: [circLayer], rep: [],
  }[tab];
  [fleetLayer, overlayCirc, detLayer, histLayer, circLayer].forEach((l) => (want.includes(l) ? l.addTo(map) : map.removeLayer(l)));
  $('report').hidden = tab !== 'rep';
  $('mapwrap').hidden = tab === 'rep';
  $('trips').hidden = !(tab === 'live' && detImei && detTrips.length);
  document.body.classList.toggle('no-side', tab === 'rep');
  $('side').hidden = tab === 'rep';
  $('sideToggle').hidden = tab === 'rep';
  if (tab === 'rep') { if (!repLoaded) loadReport(); }
  else setTimeout(() => map.invalidateSize(), 30);
  if (tab === 'circ' && !circLayer.getLayers().length) showCircuit();
});
$('sideToggle').onclick = () => {
  document.body.classList.toggle('side-closed');
  $('sideToggle').textContent = document.body.classList.contains('side-closed') ? '›' : '‹';
  setTimeout(() => map.invalidateSize(), 250);
};
document.querySelectorAll('.utabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.utabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('uVeh').hidden = b.dataset.u !== 'veh';
  $('uCirc').hidden = b.dataset.u !== 'circ';
});
$('search').oninput = () => { if (searchDone) renderList(); };
$('search').onkeydown = (e) => { if (e.key === 'Enter') runSearch(); };
$('lvGo').onclick = runSearch;
$('lvBack').onclick = () => { $('lvRes').hidden = true; $('lvForm').hidden = false; };
$('lvSort').onchange = renderList;
$('lvRefresh').onclick = async () => { await loadFleet(false); loadLiveRates(); };
$('dClose').onclick = closeDetail;
document.querySelectorAll('.det-tabs button').forEach((b) => b.onclick = () => detTab(b.dataset.d));
$('dGo').onclick = loadDetTrips;
$('tripsToggle').onclick = () => {
  $('trips').classList.toggle('min');
  $('tripsToggle').textContent = $('trips').classList.contains('min') ? '⌃' : '⌄';
  setTimeout(() => map.invalidateSize(), 50);
};
$('tripsPer').onchange = () => { tPage = 0; renderTripsTable(); };
$('tPrev').onclick = () => { tPage--; renderTripsTable(); };
$('tNext').onclick = () => { tPage++; renderTripsTable(); };
$('tripsCsv').onclick = exportTrips;

$('hGo').onclick = loadHistory;
$('hSlider').oninput = (e) => moveCursor(+e.target.value);
$('hDate').value = $('cDate').value = $('dDate').value = isoDay(new Date());
$('cCirc').onchange = showCircuit;
$('cGo').onclick = calcCircuit;
{
  const y = new Date(); y.setDate(y.getDate() - 1);
  const w = new Date(); w.setDate(w.getDate() - 7);
  $('rFrom').value = isoDay(w); $('rTo').value = isoDay(y);
}
$('rGo').onclick = loadReport;
$('rCalc').onclick = recalcReport;
$('rCsv').onclick = exportCsv;
document.querySelectorAll('.rep-tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.rep-tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('rRes').hidden = b.dataset.r !== 'res';
  $('rPlan').hidden = b.dataset.r !== 'plan';
  if (b.dataset.r === 'plan') loadPlanning();
});

// ---------- Démarrage (avec connexion) ----------
let started = false, liveChannel = null;
function startApp(session) {
  $('login').hidden = true;
  $('userMail').textContent = `Déconnexion (${session.user.email})`;
  if (started) return;
  started = true;
  loadFleet(true).then(loadLiveRates);
  loadCircuits();
  liveChannel = sb.channel('positions-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'positions' }, (payload) => {
      const known = devices.has(payload.new.imei);
      updatePos(payload.new);
      if (!known) { renderTree(); fillHistSelect(); }
      renderList();
    })
    .subscribe((st) => {
      const on = st === 'SUBSCRIBED';
      $('live').classList.toggle('on', on);
      $('live').title = on ? 'Temps réel connecté' : 'Reconnexion…';
    });
  setInterval(renderList, 60000);                               // « il y a X min » et statuts
  setInterval(() => started && loadFleet(false), 300000);       // resynchronisation toutes les 5 min
  setInterval(() => started && loadLiveRates(), 300000);        // % des circuits en cours toutes les 5 min
}
function showLogin(msg, isErr) {
  $('login').hidden = false;
  $('loginForm').hidden = false;
  $('resetForm').hidden = true;
  $('loginErr').textContent = msg || '';
  $('loginErr').classList.toggle('err-on', !!isErr);
  if (SUPPORT_CONTACT) { $('lSupport').href = SUPPORT_CONTACT; $('lSupport').hidden = false; }
  setTimeout(() => $('lEmail').focus(), 50);
}
function showReset() {
  showLogin();
  $('loginForm').hidden = true;
  $('resetForm').hidden = false;
  setTimeout(() => $('rPass1').focus(), 50);
}

if (SUPABASE_ANON_KEY.startsWith('COLLE_ICI')) {
  showErr('Configure SUPABASE_ANON_KEY en haut du fichier index.html.');
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    $('lGo').disabled = true;
    $('loginErr').textContent = 'Connexion…';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
    $('lGo').disabled = false;
    if (error) { showLogin(/invalid/i.test(error.message) ? 'Identifiant ou mot de passe incorrect.' : error.message, true); return; }
    $('lPass').value = '';
    startApp(data.session);
  };

  $('lForgot').onclick = async (e) => {
    e.preventDefault();
    const email = $('lEmail').value.trim();
    if (!email) { showLogin('Saisis ton email, puis clique sur « Mot de passe oublié ? ».', true); return; }
    showLogin('Envoi du lien…');
    $('lEmail').value = email;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) showLogin(error.message, true);
    else showLogin('Si ce compte existe, un email de réinitialisation vient d\'être envoyé.');
    $('lEmail').value = email;
  };

  const recovering = /type=recovery/.test(location.hash);
  $('resetForm').onsubmit = async (e) => {
    e.preventDefault();
    const p1 = $('rPass1').value, p2 = $('rPass2').value;
    const msg = (t, err) => { $('resetMsg').textContent = t; $('resetMsg').classList.toggle('err-on', !!err); };
    if (p1.length < 8) return msg('8 caractères minimum.', true);
    if (p1 !== p2) return msg('Les deux mots de passe ne correspondent pas.', true);
    $('rGoPass').disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    $('rGoPass').disabled = false;
    if (error) return msg(error.message, true);
    history.replaceState(null, '', location.pathname);
    const { data: sess } = await sb.auth.getSession();
    if (sess.session) startApp(sess.session); else showLogin('Mot de passe modifié. Connecte-toi.');
  };

  $('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { showReset(); return; }
    if (event === 'SIGNED_OUT' || (!session && started)) location.reload();
  });

  sb.auth.getSession().then(({ data }) => {
    if (recovering) showReset();
    else if (data.session) startApp(data.session);
    else showLogin();
  });
}
</script>
