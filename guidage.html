<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d4f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SOS – Guidage chauffeur</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --blue: #1d4f8f; --blue2: #2f6fbf; --red: #BD171E; --green: #16a34a; --muted: #6b7280; --border: #e3e7ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background: #fff; color: #1f2937; overflow: hidden; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  input, select { width: 100%; padding: 12px; border: 1px solid #c9d2df; border-radius: 6px; font-size: 16px; font-family: inherit; background: #fff; }
  .btn { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: var(--blue2); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .btn2 { padding: 10px 14px; border: 1px solid var(--blue2); border-radius: 8px; background: #fff; color: var(--blue2); font-size: 15px; cursor: pointer; }
  .msg { color: var(--muted); font-size: 14px; }
  .err { color: var(--red); font-size: 14px; min-height: 18px; }

  /* écrans de sélection */
  .screen { position: fixed; inset: 0; overflow: auto; background: #f4f6f9; z-index: 20; }
  .sc-head { background: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--red) 50%, var(--blue2) 50%) 1; }
  .sc-head img { height: 40px; }
  .sc-head b { color: var(--blue); font-size: 17px; }
  .sc-body { padding: 16px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; color: var(--blue); font-size: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  label input, label select { margin-top: 5px; }
  .clist { display: flex; flex-direction: column; gap: 8px; }
  .citem { display: flex; align-items: center; gap: 12px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; background: #fff; }
  .citem.on { border-color: var(--blue2); background: #eef3fa; }
  .citem .t { flex: 1; }
  .citem b { display: block; font-size: 16px; }
  .citem small { color: var(--muted); }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--blue2); color: #fff; white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: 10px; color: #1f2937; font-size: 15px; margin: 12px 0; }
  .chk input { width: 22px; height: 22px; margin: 0; }

  /* guidage */
  #nav { position: fixed; inset: 0; }
  #map { position: absolute; inset: 0; }
  .banner { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: var(--blue); color: #fff; display: flex; gap: 14px; align-items: center;
    padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
  .banner.off { background: var(--red); }
  .banner.app { background: #6d28d9; }
  .banner.done { background: var(--green); }
  .b-ic { width: 66px; height: 66px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .b-ic svg { width: 62px; height: 62px; }
  .b-t { flex: 1; min-width: 0; }
  .b-d { font-size: 30px; font-weight: 800; line-height: 1.05; }
  .b-x { font-size: 18px; line-height: 1.25; margin-top: 2px; }
  .b-n { font-size: 13px; opacity: .85; margin-top: 4px; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; background: #fff; box-shadow: 0 -3px 10px rgba(0,0,0,.2);
    padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .bt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bt-row b { font-size: 17px; color: var(--blue); }
  .pbar { height: 10px; border-radius: 5px; background: #e5e7eb; overflow: hidden; margin: 8px 0; }
  .pbar div { height: 100%; background: var(--green); transition: width .5s; }
  .stats { display: flex; justify-content: space-between; font-size: 14px; color: #374151; }
  .stats span b { font-size: 18px; color: #111827; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acts button { flex: 1; padding: 11px 6px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; font-size: 14px; cursor: pointer; color: #1f2937; }
  .acts button.on { background: var(--blue2); color: #fff; border-color: var(--blue2); }
  .acts button.stop { color: var(--red); }
  .me { width: 26px; height: 26px; }
  .me svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .gpswait { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1100; background: rgba(17,24,39,.85); color: #fff;
    padding: 14px 18px; border-radius: 10px; font-size: 15px; text-align: center; max-width: 80vw; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ======= CONFIGURATION (mêmes valeurs que index.html) =======
const SUPABASE_URL = 'https://zhhpkuxkqzxttdaqwpyx.supabase.co';
const SUPABASE_ANON_KEY = 'COLLE_ICI_LA_CLE_ANON';
const OSRM_URL = 'https://router.project-osrm.org';   // calcul d'itinéraire (gratuit, OpenStreetMap)
const ON_ROUTE_M = 35;       // distance max au tracé pour être « sur le circuit »
// =============================================================

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const R = 6371000, rad = Math.PI / 180;
const distM = (a, b) => { const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
const brg = (a, b) => { const y = Math.sin((b[1] - a[1]) * rad) * Math.cos(b[0] * rad);
  const x = Math.cos(a[0] * rad) * Math.sin(b[0] * rad) - Math.sin(a[0] * rad) * Math.cos(b[0] * rad) * Math.cos((b[1] - a[1]) * rad);
  return (Math.atan2(y, x) / rad + 360) % 360; };
const angDiff = (a, b) => ((b - a + 540) % 360) - 180;          // > 0 : vers la droite
const fmtDist = (m) => (m >= 1000 ? `${(m / 1000).toFixed(1).replace('.', ',')} km` : `${Math.max(10, Math.round(m / 10) * 10)} m`);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DOW = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];

// ---------- Flèches de manœuvre (dessin simple) ----------
function arrowSvg(kind, angle = 0) {
  const W = '#fff';
  if (kind === 'uturn') return `<svg viewBox="0 0 64 64"><path d="M40 56V24a12 12 0 0 0-24 0v18" fill="none" stroke="${W}" stroke-width="7" stroke-linecap="round"/><path d="M6 36l10 12 10-12z" fill="${W}"/></svg>`;
  if (kind === 'arrive') return `<svg viewBox="0 0 64 64"><path d="M18 58V8" stroke="${W}" stroke-width="6" stroke-linecap="round"/><path d="M20 10h30l-8 10 8 10H20z" fill="${W}"/></svg>`;
  if (kind === 'roundabout') return `<svg viewBox="0 0 64 64"><circle cx="32" cy="30" r="12" fill="none" stroke="${W}" stroke-width="6"/><path d="M32 60V44" stroke="${W}" stroke-width="6"/><g transform="rotate(${angle} 32 30)"><path d="M32 18V4" stroke="${W}" stroke-width="6"/><path d="M22 10l10-10 10 10z" fill="${W}"/></g></svg>`;
  if (kind === 'warn') return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="${W}" stroke-width="6"/><path d="M32 16v20" stroke="${W}" stroke-width="7" stroke-linecap="round"/><circle cx="32" cy="46" r="4" fill="${W}"/></svg>`;
  // flèche courbée : tronc vertical puis branche orientée selon l'angle
  const a = Math.max(-150, Math.min(150, angle));
  return `<svg viewBox="0 0 64 64"><path d="M32 60V36" stroke="${W}" stroke-width="7" stroke-linecap="round"/>
    <g transform="rotate(${a} 32 36)"><path d="M32 36V14" stroke="${W}" stroke-width="7" stroke-linecap="round"/><path d="M20 18l12-14 12 14z" fill="${W}"/></g></svg>`;
}

// ---------- Voix ----------
let voiceOn = true;
function say(t) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; u.rate = 1.02; speechSynthesis.speak(u); } catch {}
}

// ---------- Noms de rues (OpenStreetMap, avec cache) ----------
const geoCache = ls.get('sos_geo', {});
const geoQ = []; let geoBusy = false;
function streetName(p) {
  const k = `${p[0].toFixed(4)},${p[1].toFixed(4)}`;
  if (geoCache['r:' + k] !== undefined) return Promise.resolve(geoCache['r:' + k]);
  return new Promise((res) => { geoQ.push({ k, p, res }); pump(); });
}
async function pump() {
  if (geoBusy) return; geoBusy = true;
  while (geoQ.length) {
    const j = geoQ.shift();
    if (geoCache['r:' + j.k] !== undefined) { j.res(geoCache['r:' + j.k]); continue; }
    let name = '';
    try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=fr&lat=${j.p[0]}&lon=${j.p[1]}`);
      const d = await r.json(); const a = d.address || {}; name = a.road || a.pedestrian || a.square || ''; } catch {}
    geoCache['r:' + j.k] = name; ls.set('sos_geo', geoCache); j.res(name);
    await new Promise((r) => setTimeout(r, 1100));
  }
  geoBusy = false;
}

// ---------- Préparation du tracé ----------
// Assemble les parties du MultiLineString dans l'ordre (en retournant une partie si son extrémité est plus proche)
function buildRoute(geojson, reverse) {
  let parts = (geojson.type === 'MultiLineString' ? geojson.coordinates : [geojson.coordinates]).map((l) => l.map(([x, y]) => [y, x]));
  if (reverse) parts = parts.reverse().map((l) => l.slice().reverse());
  const pts = [];
  parts.forEach((l, i) => {
    if (i && pts.length) {
      const last = pts[pts.length - 1];
      if (distM(last, l[l.length - 1]) < distM(last, l[0])) l = l.slice().reverse();
    }
    l.forEach((p) => { if (!pts.length || distM(pts[pts.length - 1], p) > 0.5) pts.push(p); });
  });
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + distM(pts[i - 1], pts[i]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function pointAt(rt, d) {
  d = Math.max(0, Math.min(rt.len, d));
  let i = 1; while (i < rt.cum.length - 1 && rt.cum[i] < d) i++;
  const a = rt.pts[i - 1], b = rt.pts[i], seg = rt.cum[i] - rt.cum[i - 1] || 1, t = (d - rt.cum[i - 1]) / seg;
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
// Manœuvres déduites de la forme du tracé
function buildManeuvers(rt) {
  const cand = [];
  for (let i = 1; i < rt.pts.length - 1; i++) {
    const d = rt.cum[i];
    const a = pointAt(rt, d - 18), b = rt.pts[i], c = pointAt(rt, d + 18);
    if (distM(a, b) < 6 || distM(b, c) < 6) continue;
    const delta = angDiff(brg(a, b), brg(b, c));
    if (Math.abs(delta) >= 35) cand.push({ d, delta, p: b });
  }
  const man = [];
  cand.forEach((c) => { const l = man[man.length - 1]; if (l && c.d - l.d < 20) { if (Math.abs(c.delta) > Math.abs(l.delta)) Object.assign(l, c); } else man.push({ ...c }); });
  man.forEach((m) => {
    const ad = Math.abs(m.delta), side = m.delta > 0 ? 'droite' : 'gauche';
    if (ad >= 150) { m.kind = 'uturn'; m.txt = 'Faites demi-tour'; }
    else if (ad >= 110) { m.kind = 'turn'; m.txt = `Tournez franchement à ${side}`; }
    else if (ad >= 60) { m.kind = 'turn'; m.txt = `Tournez à ${side}`; }
    else { m.kind = 'turn'; m.txt = `Serrez à ${side}`; }
    m.angle = m.delta; m.spoken = {};
  });
  man.push({ d: rt.len, kind: 'arrive', angle: 0, txt: 'Fin du circuit', spoken: {}, p: rt.pts[rt.pts.length - 1] });
  return man;
}

// ---------- Itinéraire routier (OSRM) pour rejoindre le circuit ----------
const MOD = { uturn: 'faites demi-tour', 'sharp right': 'tournez franchement à droite', right: 'tournez à droite', 'slight right': 'serrez à droite',
  straight: 'continuez tout droit', 'slight left': 'serrez à gauche', left: 'tournez à gauche', 'sharp left': 'tournez franchement à gauche' };
const MODANG = { uturn: 180, 'sharp right': 135, right: 90, 'slight right': 45, straight: 0, 'slight left': -45, left: -90, 'sharp left': -135 };
function osrmText(st) {
  const m = st.maneuver, on = st.name ? ` sur ${st.name}` : '';
  if (m.type === 'arrive') return 'Vous êtes arrivé au point de départ du circuit';
  if (m.type === 'depart') return `Partez${on}`;
  if (m.type === 'roundabout' || m.type === 'rotary') return `Au rond-point, prenez la ${m.exit === 1 ? '1re' : (m.exit || '') + 'e'} sortie${on}`;
  const t = MOD[m.modifier] || 'continuez';
  return t.charAt(0).toUpperCase() + t.slice(1) + on;
}
async function osrmRoute(from, to) {
  const url = `${OSRM_URL}/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson&steps=true`;
  const r = await fetch(url); const d = await r.json();
  if (!d.routes || !d.routes.length) throw new Error('aucun itinéraire');
  const rt = d.routes[0];
  const pts = rt.geometry.coordinates.map(([x, y]) => [y, x]);
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + distM(pts[i - 1], pts[i]));
  const man = [];
  rt.legs[0].steps.forEach((st, i) => {
    if (i === 0) return;
    const loc = [st.maneuver.location[1], st.maneuver.location[0]];
    // distance le long de l'itinéraire jusqu'à la manœuvre
    let best = 0, bd = 1e9; pts.forEach((p, k) => { const dd = distM(p, loc); if (dd < bd) { bd = dd; best = k; } });
    const kind = st.maneuver.type === 'arrive' ? 'arrive' : (st.maneuver.type === 'roundabout' || st.maneuver.type === 'rotary') ? 'roundabout'
      : st.maneuver.modifier === 'uturn' ? 'uturn' : 'turn';
    man.push({ d: cum[best], kind, angle: MODANG[st.maneuver.modifier] || 0, txt: osrmText(st), spoken: {}, p: loc, named: true });
  });
  return { pts, cum, len: cum[cum.length - 1], man, dur: rt.duration };
}

// ---------- État du guidage ----------
const S = { circ: null, rt: null, man: [], prog: 0, segIdx: 0, mode: 'wait', offCount: 0, app: null, appProg: 0, appIdx: 0,
  follow: true, last: null, watch: null, wake: null, key: '' };
let map, lineDone, lineTodo, lineApp, meMk, accCircle;

function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  map.on('dragstart', () => { S.follow = false; $('aCenter').classList.remove('on'); });
}
function meIcon(h) {
  return L.divIcon({ className: 'me', iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<svg viewBox="0 0 26 26" style="transform:rotate(${h || 0}deg)"><circle cx="13" cy="13" r="11" fill="#2f6fbf" stroke="#fff" stroke-width="3"/><path d="M13 4l5 12-5-3-5 3z" fill="#fff"/></svg>` });
}
function drawLines() {
  const done = [], todo = [];
  const rt = S.rt; const cut = pointAt(rt, S.prog);
  let i = 0;
  for (; i < rt.pts.length && rt.cum[i] <= S.prog; i++) done.push(rt.pts[i]);
  done.push(cut); todo.push(cut);
  for (; i < rt.pts.length; i++) todo.push(rt.pts[i]);
  lineDone.setLatLngs(done); lineTodo.setLatLngs(todo);
}

// Recalage de la position sur le tracé : recherche vers l'avant uniquement (évite les allers-retours parallèles)
function snap(rt, p, fromIdx, ahead = 400, back = 3) {
  let best = null;
  const startD = rt.cum[Math.max(0, fromIdx)];
  for (let j = Math.max(0, fromIdx - back); j < rt.pts.length - 1; j++) {
    if (rt.cum[j] > startD + ahead) break;
    const a = rt.pts[j], b = rt.pts[j + 1];
    // projection approximative en mètres (plan local)
    const kx = Math.cos(a[0] * rad) * R * rad, ky = R * rad;
    const ax = 0, ay = 0, bx = (b[1] - a[1]) * kx, by = (b[0] - a[0]) * ky, px = (p[1] - a[1]) * kx, py = (p[0] - a[0]) * ky;
    const L2 = bx * bx + by * by || 1; let t = ((px - ax) * bx + (py - ay) * by) / L2; t = Math.max(0, Math.min(1, t));
    const dx = px - t * bx, dy = py - t * by, dd = Math.sqrt(dx * dx + dy * dy);
    if (!best || dd < best.dd) best = { dd, j, d: rt.cum[j] + t * (rt.cum[j + 1] - rt.cum[j]) };
  }
  return best;
}
function nearestAll(rt, p) { return snap(rt, p, 0, Infinity, 0); }

function setBanner(cls, ic, d, x, n) {
  $('banner').className = 'banner ' + (cls || '');
  $('bIc').innerHTML = ic; $('bD').textContent = d; $('bX').textContent = x; $('bN').textContent = n || '';
}
function announce(m, dist, speedKmh) {
  const far = Math.max(150, speedKmh * 8);
  const k = dist <= 22 ? 'now' : dist <= 80 ? 'mid' : dist <= far ? 'far' : null;
  if (!k || m.spoken[k]) return;
  const order = ['far', 'mid', 'now'];
  order.slice(0, order.indexOf(k) + 1).forEach((x) => { m.spoken[x] = true; });   // ne répète pas les annonces plus lointaines
  const nm = !m.named && m.street ? ` sur ${m.street}` : '';
  if (k === 'now') say(`${m.txt}${nm}`);
  else say(`Dans ${fmtDist(dist)}, ${m.txt.charAt(0).toLowerCase() + m.txt.slice(1)}${nm}`);
}
function nameUpcoming(list, fromD) {
  list.filter((m) => !m.named && m.street === undefined && m.d > fromD - 5 && m.d < fromD + 1500).slice(0, 3).forEach((m) => {
    m.street = null; const after = pointAt(S.rt, m.d + 30);
    streetName(after).then((n) => { m.street = n || ''; });
  });
}

function onFix(pos) {
  $('gpsWait').hidden = true;
  const p = [pos.coords.latitude, pos.coords.longitude];
  const spd = pos.coords.speed !== null && pos.coords.speed >= 0 ? pos.coords.speed * 3.6 : (S.last ? distM(S.last.p, p) / Math.max(1, (pos.timestamp - S.last.t) / 1000) * 3.6 : 0);
  const head = pos.coords.heading !== null && !isNaN(pos.coords.heading) ? pos.coords.heading : (S.last && distM(S.last.p, p) > 3 ? brg(S.last.p, p) : (S.last ? S.last.h : 0));
  S.last = { p, t: pos.timestamp, h: head };
  if (!meMk) meMk = L.marker(p, { icon: meIcon(head), zIndexOffset: 2000 }).addTo(map); else meMk.setLatLng(p).setIcon(meIcon(head));
  if (S.follow) map.setView(p, Math.max(map.getZoom() || 17, 16), { animate: true });
  $('nSpd').textContent = Math.round(spd);

  if (S.mode === 'wait') {
    const nb = nearestAll(S.rt, p);
    const startNear = distM(p, S.rt.pts[0]) <= 60;
    if (S.prog > 0 && nb && nb.dd <= ON_ROUTE_M) { const sn = snap(S.rt, p, S.segIdx, 600, 20); if (sn && sn.dd <= ON_ROUTE_M) { S.segIdx = sn.j; S.prog = Math.max(S.prog - 20, sn.d); } S.mode = 'circ'; }
    else if (startNear) { S.mode = 'circ'; S.segIdx = 0; S.prog = 0; }
    else { approach(p, S.prog > 0 ? pointAt(S.rt, S.prog) : S.rt.pts[0]); return; }
    say(S.prog > 0 ? 'Reprise du circuit' : 'Début du circuit. Bon courage.');
  }

  if (S.mode === 'app') {
    const a = S.app;
    const target = S.prog > 0 ? pointAt(S.rt, S.prog) : S.rt.pts[0];
    if (!a && distM(p, target) > 40) {
      setBanner('app', arrowSvg('turn', Math.round(angDiff(head, brg(p, target)))), fmtDist(distM(p, target)), 'Rejoignez le circuit', 'Suivez la flèche');
      return;
    }
    if (distM(p, target) <= 40) { S.mode = 'circ'; lineApp.setLatLngs([]); S.app = null; say(S.prog > 0 ? 'Vous avez rejoint le circuit' : 'Vous êtes au départ du circuit. Début du guidage.'); }
    else {
      const sn = snap(a, p, S.appIdx, 800, 5);
      if (!sn || sn.dd > 60) { S.offCount++; if (S.offCount >= 4) { S.offCount = 0; approach(p, target, true); } }
      else { S.offCount = 0; S.appIdx = sn.j; S.appProg = sn.d; }
      const nxt = a.man.find((m) => m.d > S.appProg + 3) || a.man[a.man.length - 1];
      const dist = Math.max(0, nxt.d - S.appProg), nn = a.man[a.man.indexOf(nxt) + 1];
      setBanner('app', arrowSvg(nxt.kind, nxt.angle), fmtDist(dist), nxt.txt, `Vers le départ du circuit · ${fmtDist(a.len - S.appProg)}${nn ? ' · puis ' + nn.txt.toLowerCase() : ''}`);
      $('nMode').textContent = 'Itinéraire vers le circuit';
      announce(nxt, dist, spd);
      return;
    }
  }

  // ---- sur le circuit ----
  const sn = snap(S.rt, p, S.segIdx);
  if (!sn || sn.dd > ON_ROUTE_M) {
    S.offCount++;
    if (S.offCount === 3) say('Attention, vous avez quitté le circuit. Rejoignez le tracé.');
    if (S.offCount >= 3) {
      const back = pointAt(S.rt, S.prog);
      setBanner('off', arrowSvg('warn'), `${Math.round(sn ? sn.dd : distM(p, back))} m`, 'Hors circuit : rejoignez le tracé', 'Touchez « Itinéraire » pour être guidé jusqu\'au circuit');
      $('nMode').textContent = 'Hors circuit';
    }
    return;
  }
  if (S.offCount >= 3) say('Vous êtes de retour sur le circuit');
  S.offCount = 0;
  if (sn.d >= S.prog - 15) { S.segIdx = sn.j; S.prog = Math.max(S.prog, sn.d); }
  drawLines();
  const pct = Math.min(100, (100 * S.prog) / S.rt.len);
  $('nBar').style.width = pct + '%';
  $('nPct').textContent = `${Math.floor(pct)} %`;
  $('nRest').textContent = fmtDist(S.rt.len - S.prog);
  $('nMode').textContent = 'Sur le circuit';
  ls.set('sos_guidage_' + S.key, { prog: S.prog, seg: S.segIdx, t: Date.now() });

  nameUpcoming(S.man, S.prog);
  const k = S.man.findIndex((m) => m.d > S.prog + 3);
  const nxt = S.man[k] || S.man[S.man.length - 1], nn = S.man[k + 1];
  const dist = Math.max(0, nxt.d - S.prog);
  if (nxt.kind === 'arrive' && dist < 25) {
    setBanner('done', arrowSvg('arrive'), '100 %', 'Circuit terminé', 'Bravo !');
    if (!nxt.spoken.now) { nxt.spoken.now = true; say('Circuit terminé. Bravo.'); }
    ls.set('sos_guidage_' + S.key, null);
    return;
  }
  const nm = nxt.street ? ` sur ${nxt.street}` : '';
  setBanner('', arrowSvg(nxt.kind, nxt.angle), fmtDist(dist), nxt.txt + nm, nn ? `Puis : ${nn.txt.toLowerCase()}${nn.street ? ' sur ' + nn.street : ''}` : '');
  announce(nxt, dist, spd);
}

let approaching = false;
async function approach(p, target, forced) {
  if (approaching) return;
  if (S.app && !forced) { S.mode = 'app'; return; }
  approaching = true;
  setBanner('app', arrowSvg('turn', 0), fmtDist(distM(p, target)), 'Calcul de l\'itinéraire vers le circuit…', '');
  try {
    S.app = await osrmRoute(p, target); S.appIdx = 0; S.appProg = 0; S.mode = 'app';
    lineApp.setLatLngs(S.app.pts);
    if (!forced) map.fitBounds(L.latLngBounds(S.app.pts).extend(S.rt.pts[0]), { padding: [140, 40] });
    say(`Itinéraire vers le circuit : ${fmtDist(S.app.len)}. ${S.app.man[0] ? S.app.man[0].txt : ''}`);
  } catch (e) {
    S.mode = 'app'; S.app = null;
    setBanner('app', arrowSvg('turn', Math.round(angDiff(S.last ? S.last.h : 0, brg(p, target)))), fmtDist(distM(p, target)), 'Rejoignez le départ du circuit (itinéraire indisponible)', 'Suivez la flèche');
  }
  approaching = false;
}

async function startNav(c, reverse, resume) {
  S.circ = c;
  S.key = `${c.id}_${reverse ? 'r' : 'n'}`;
  S.rt = buildRoute(c.geojson, reverse);
  S.man = buildManeuvers(S.rt);
  S.mode = 'wait'; S.prog = 0; S.segIdx = 0; S.app = null; S.offCount = 0; S.follow = true;
  const saved = resume ? ls.get('sos_guidage_' + S.key, null) : null;
  if (saved) { S.prog = saved.prog; S.segIdx = saved.seg; }
  $('scPick').hidden = true; $('nav').hidden = false; $('gpsWait').hidden = false;
  initMap();
  setTimeout(() => map.invalidateSize(), 50);
  [lineDone, lineTodo, lineApp].forEach((l) => l && map.removeLayer(l));
  lineTodo = L.polyline([], { color: '#2f6fbf', weight: 8, opacity: 0.85 }).addTo(map);
  lineDone = L.polyline([], { color: '#16a34a', weight: 8, opacity: 0.85 }).addTo(map);
  lineApp = L.polyline([], { color: '#6d28d9', weight: 6, dashArray: '10 8' }).addTo(map);
  drawLines();
  map.fitBounds(L.latLngBounds(S.rt.pts), { padding: [140, 40] });
  $('nCirc').textContent = `${c.code}${c.name && c.name !== c.code ? ' — ' + c.name : ''}`;
  $('nRest').textContent = fmtDist(S.rt.len - S.prog);
  $('nPct').textContent = `${Math.floor(100 * S.prog / S.rt.len)} %`; $('nBar').style.width = `${100 * S.prog / S.rt.len}%`;
  setBanner('', arrowSvg('turn', 0), '', 'En attente du GPS…', `${S.man.length - 1} manœuvres · ${fmtDist(S.rt.len)}`);
  voiceOn = $('sVoice').checked; $('aVoice').classList.toggle('on', voiceOn);
  if (!navigator.geolocation) { setBanner('off', arrowSvg('warn'), '', 'GPS indisponible sur cet appareil', ''); return; }
  S.watch = navigator.geolocation.watchPosition(onFix, (e) => {
    $('gpsWait').hidden = false;
    $('gpsWait').textContent = e.code === 1 ? 'Autorise l\'accès à la position (GPS) pour ce site dans le navigateur.' : 'Signal GPS indisponible… place-toi à l\'extérieur.';
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  try { S.wake = await navigator.wakeLock.request('screen'); } catch {}
}
function stopNav() {
  if (S.watch !== null) navigator.geolocation.clearWatch(S.watch);
  S.watch = null;
  try { S.wake && S.wake.release(); } catch {}
  try { speechSynthesis.cancel(); } catch {}
  $('nav').hidden = true; showPick();
}

let circuits = [], plans = [], devs = [], selCirc = null;
async function showPick() {
  $('scLogin').hidden = true; $('scPick').hidden = false;
  if (!circuits.length) {
    const [c, p, d] = await Promise.all([sb.from('circuits_list').select('id,code,name,km,geojson').order('code'),
      sb.from('planning_list').select('*').eq('actif', true), sb.from('devices').select('imei,name,plate,categorie')]);
    if (c.error) { $('sErr').textContent = c.error.message; return; }
    circuits = c.data; plans = p.data || []; devs = (d.data || []).sort((a, b) => String(a.name || a.imei).localeCompare(String(b.name || b.imei), 'fr', { numeric: true }));
    $('sVeh').innerHTML = '<option value="">— choisir —</option>' + devs.map((x) => `<option value="${x.imei}">${esc(x.name || x.plate || x.imei)}${x.categorie ? ' · ' + esc(x.categorie) : ''}</option>`).join('');
    $('sVeh').value = ls.get('sos_guidage_veh', '');

}
function todayPlans(imei) {
  const now = new Date(), dk = DOW[now.getDay()];
  return plans.filter((p) => p.imei === imei && p[dk]).sort((a, b) => a.heure_debut.localeCompare(b.heure_debut));
}
function renderList() {
  const imei = $('sVeh').value, q = $('sSearch').value.trim().toLowerCase();
  const mine = imei ? todayPlans(imei) : [];
  const mineIds = new Set(mine.map((p) => p.circuit_id));
  const items = [
    ...mine.map((p) => ({ c: circuits.find((c) => c.id === p.circuit_id), tag: `${p.heure_debut.slice(0, 5)}–${p.heure_fin.slice(0, 5)}`, plan: true })),
    ...circuits.filter((c) => !mineIds.has(c.id)).map((c) => ({ c })),
  ].filter((x) => x.c && (!q || `${x.c.code} ${x.c.name || ''}`.toLowerCase().includes(q)));
  $('sList').innerHTML = (mine.length ? '<div class="msg">Mes circuits du jour (planning) :</div>' : '') + items.map((x, i) => `
    ${!x.plan && i === mine.length && mine.length ? '<div class="msg" style="margin-top:6px">Autres circuits :</div>' : ''}
    <div class="citem${selCirc && selCirc.id === x.c.id ? ' on' : ''}" data-id="${x.c.id}"><div class="t"><b>${esc(x.c.code)}</b><small>${esc(x.c.name && x.c.name !== x.c.code ? x.c.name + ' · ' : '')}${x.c.km} km</small></div>
    ${x.tag ? `<span class="tag">${x.tag}</span>` : ''}</div>`).join('') || '<p class="msg">Aucun circuit.</p>';
  $('sList').querySelectorAll('.citem').forEach((el) => el.onclick = () => { selCirc = circuits.find((c) => c.id === +el.dataset.id); renderList(); });
  $('sGo').disabled = !selCirc;
  const saved = selCirc ? ls.get(`sos_guidage_${selCirc.id}_${$('sRev').checked ? 'r' : 'n'}`, null) : null;
  $('sResume').innerHTML = saved && Date.now() - saved.t < 12 * 3600000 ? `Guidage en cours sur ce circuit : <a href="#" id="sRes">reprendre à ${Math.round(100 * saved.prog / buildRoute(selCirc.geojson, $('sRev').checked).len)} %</a>` : '';
  if ($('sRes')) $('sRes').onclick = (e) => { e.preventDefault(); startNav(selCirc, $('sRev').checked, true); };
}

document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && !$('nav').hidden) { try { S.wake = await navigator.wakeLock.request('screen'); } catch {} } });

(async () => {
  if (SUPABASE_ANON_KEY.startsWith('COLLE_ICI')) { $('scLogin').hidden = false; $('lErr').textContent = 'Configure SUPABASE_ANON_KEY en haut du fichier guidage.html.'; return; }
  const { data } = await sb.auth.getSession();
  if (data.session) {
    await showPick();
    const q = new URLSearchParams(location.search);
    if (q.get('c')) { selCirc = circuits.find((c) => String(c.id) === q.get('c')); if (q.get('imei')) $('sVeh').value = q.get('imei'); renderList(); }
  } else $('scLogin').hidden = false;
})();
</script>
